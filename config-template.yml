# speckit-blueprint configuration. Every key is optional; defaults are shown.
schema: 2

# Where the blueprint lives (a project with one blueprint; for several, see `blueprints:` at the end).
blueprint_path: docs/BLUEPRINT.md

# Where spec-kit feature folders live.
specs_dir: specs

# Where bootstrap writes the decisions log and the review checklist.
decisions_path: docs/DECISIONS.md
review_checklist_path: docs/REVIEW-CHECKLIST.md

# false: bootstrap leaves CLAUDE.md alone (for a CLAUDE.md that only imports other files).
claude_md: true

# Blueprint sections compiled into .specify/memory/constitution.md (or its managed block)
# (read by /speckit-tasks and /speckit-implement in every epic, so keep it lean).
constitution_sections:
  - "13.2"
  - "13.5"
  - "13.6"
  - "13.7"
  - "13.9"
  - "13.10"
  - "14.2"
  - "14.3"
  - "14.8"
  - "12.10"

# own:    bootstrap writes the whole constitution (a new project).
# append: the project keeps its constitution; bootstrap maintains one managed block in it, which applies
#         only to features compiled from the blueprint and yields to the project's principles.
# auto:   own when the constitution is missing or still the `specify init` template, otherwise append.
constitution_mode: auto

# append mode: when the managed block is added or its rules change, bump the project's constitution
# version (minor | patch | none) and set Last Amended. No Sync Impact Report comment is created.
constitution_version_bump: minor

# Blueprint sections copied into each epic's plan.md "Technical Context".
plan_sections:
  - "12.2"
  - "13.1"
  - "13.3"
  - "13.4"

# IDs of these types found inside resolved flows, screens and edge cases are resolved too.
second_level_types:
  - CP
  - EC

# Block Edit/Write on compiled files (spec.md, plan.md, research.md, data-model.md,
# quickstart.md, contracts/, the managed constitution rules) in Claude Code.
guard: true

# Steps that must run at a guaranteed reasoning level (low | medium | high | xhigh | max). They run their
# reasoning in a subagent started at that level, whatever the session's level; a hook checks the real
# level. Every other step (compile, tasks, implement, the fixes between review passes, …) runs at the
# session's level. `session` takes a step off the list.
effort:
  discover: max
  amend: max
  review: max

# Model for those subagents: inherit (the session's), or an alias such as opus or sonnet.
effort_model: inherit

# The review loop: each pass is a full review in a fresh subagent at `effort.review` that fixes nothing;
# the session fixes what it found, and a new pass reviews everything again, until one finds nothing. One
# review run stops after this many passes and asks the user (1 to 20).
# review_passes: 5

# How /speckit-implement builds an epic. sequential: one session, task after task. segments: the open
# tasks are planned into stages from their dependencies (`blueprint.py tasks-graph`); each segment, the
# serial ones that open and join the chains as much as each parallel chain, is built by ONE subagent, task
# after task, at the session's effort; the session only orchestrates and relays questions to you
# (references/segments.md).
# build:
#   mode: segments
#   max_parallel: 3        # chains at the same time (1 to 8)
#   min_chain_tasks: 2     # a smaller chain joins another
#   skills: []             # skills every segment's subagent loads before its first edit (the hook checks)

# Metrics from Claude Code transcripts (time, tokens, cost, model, effort per epic and story):
# local: kept in the hub's .git, never committed; commit: also a summary per finished epic in its feature
# folder; off: none.
metrics: local

# Repositories the epics change, when the code lives outside this repository (the hub). Paths are
# relative to this repository. Each epic's **Repositories** table names the ones it changes. Without this
# map the hub is the only repository.
#
# repositories:
#   wiki:                        # the hub itself, when its tasks change it too
#     path: .
#     branch_prefix: docs/
#   desk:
#     path: ../desk
#     gate: make check           # what `blueprint.py gate` runs there
#     base: main                 # default base branch of epic branches
#     branch_prefix: feat/       # epic branches: <prefix><feature folder>
#     remote: git@github.com:org/desk.git   # where `blueprint.py workspace setup` clones it from
#   id: {path: ../id, gate: make lint test, remote: ../id.git}   # relative to the hub's own URL
#
# path defaults to ../<name>. A relative remote resolves against the hub's `origin`, as git's relative
# submodule URLs do, so one config serves SSH and HTTPS clones. In blueprint-config.local.yml a
# repository's settings override these one by one.

# Epic branch names are <prefix><feature folder> (Spec Kit's convention). Unset: the prefix from Spec
# Kit's git extension config, else none. A repository's own branch_prefix wins.
# branch_prefix: ""

# Epic worktrees (`blueprint.py workspace <epic> --create`) go to <repository parent>/<worktrees_dir>/.
worktrees_dir: .worktrees

# Several blueprints in one project (one per product), instead of blueprint_path, decisions_path and
# review_checklist_path above. Each id gets its own decisions log, review checklist, constitution block
# and CLAUDE.md block; feature folders are named NNN-<id>-eNN-<slug> and their .blueprint.json records
# the id. Commands take `--blueprint <id>` (or `<id>:E01`) and default to the active feature's blueprint.
#
# default_blueprint: one
# blueprints:
#   one:
#     path: docs/BLUEPRINT.md
#     decisions: docs/DECISIONS.md               # default: next to the blueprint (docs/DECISIONS.md)
#     checklist: docs/REVIEW-CHECKLIST.md        # default: next to the blueprint
#   desk:
#     path: docs/desk/BLUEPRINT.md
#     prefix: DESK              # how its IDs are written in shared files (DESK:DR-03); default: the id in
#                               # capitals when there are several blueprints, "" to switch off
#     number_base: 500          # its feature folders are numbered from 501, so parallel branches of
#                               # different blueprints never take the same number
#     sources: [desk, desk-prototype]   # repositories (or paths) brownfield discover reads
#     constitution_sections: ["13.2", "13.5", "14.2"]   # optional: overrides the lists above for this id
#     plan_sections: ["12.2", "13.4"]
