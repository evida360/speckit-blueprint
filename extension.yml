schema_version: "1.0"

extension:
  id: blueprint
  name: "Blueprint"
  version: "0.7.0"
  description: "Evidence-backed product discovery into blueprints, compiled into Spec Kit features one epic at a time, across one or many repositories (Claude Code)"
  author: "Mohsen Samiei"
  repository: "https://github.com/mohsensamiei/speckit-blueprint"
  license: "MIT"
  homepage: "https://github.com/mohsensamiei/speckit-blueprint"

requires:
  speckit_version: ">=1.2.0,<2.0.0"
  tools:
    - name: python3
      version: ">=3.9"
      required: true
    - name: git
      required: false

provides:
  commands:
    - name: speckit.blueprint.flow
      file: commands/flow.md
      description: "Drive a blueprint-driven project: read its state and run the right next step"
    - name: speckit.blueprint.discover
      file: commands/discover.md
      description: "Turn an idea into an evidence-backed build blueprint (intake, research, decisions, epics)"
    - name: speckit.blueprint.amend
      file: commands/amend.md
      description: "Change a blueprint deliberately (amendment) and recompile the epics it affects"
    - name: speckit.blueprint.compile
      file: commands/compile.md
      description: "Compile one blueprint epic into a Spec Kit feature folder and make it active"
    - name: speckit.blueprint.context
      file: commands/context.md
      description: "Before implement (hook): load a blueprint feature's spec and rules, check its preconditions"
    - name: speckit.blueprint.review
      file: commands/review.md
      description: "After implement (hook): the review loop (full passes at max that fix nothing, fixes here, until clean), then the handoff"
    - name: speckit.blueprint.graph
      file: commands/graph.md
      description: "After tasks (hook): check the task graph of a blueprint feature and show the stages it builds in"
    - name: speckit.blueprint.answers
      file: commands/answers.md
      description: "Before Spec Kit's questioning commands (hook): proposed answers come from the blueprint, tagged with their source"
    - name: speckit.blueprint.hook
      file: commands/hook.md
      description: "Internal: handler for Claude Code events (session start, tool use, stop)"

  config:
    - name: "blueprint-config.yml"
      template: "config-template.yml"
      description: "Blueprints, repositories, guaranteed effort per step, metrics and the guard"
      required: false

hooks:
  before_specify:
    command: speckit.blueprint.answers
    optional: false
    description: "Blueprint projects: questions take their defaults from the blueprint; an epic is compiled, not specified"
  before_clarify:
    command: speckit.blueprint.answers
    optional: false
    description: "Blueprint features: recommended answers come from the blueprint, tagged; answers become amendments or decision records"
  before_plan:
    command: speckit.blueprint.answers
    optional: false
    description: "Blueprint features: the plan is compiled; unknowns take their defaults from the blueprint"
  before_tasks:
    command: speckit.blueprint.answers
    optional: false
    description: "Blueprint features: the scope is the whole epic; choices come from the plan and the blueprint"
  before_analyze:
    command: speckit.blueprint.answers
    optional: false
    description: "Blueprint features: recommendations cite the blueprint and route spec defects to an amendment"
  before_checklist:
    command: speckit.blueprint.answers
    optional: false
    description: "Blueprint features: checklist questions and items take their defaults and IDs from the blueprint"
  after_tasks:
    command: speckit.blueprint.graph
    optional: false
    description: "Blueprint features: dependencies and file paths in tasks.md are checked; the stage plan is shown"
  before_implement:
    command: speckit.blueprint.context
    optional: false
    description: "For blueprint features only: load spec.md and the build rules, check preconditions"
  after_implement:
    command: speckit.blueprint.review
    optional: false
    description: "For blueprint features only: review passes at max that fix nothing, fixes in this session, until a pass is clean; then review.md"

events:
  session_start:
    command: speckit.blueprint.hook
    timeout: 20
  pre_tool_use:
    command: speckit.blueprint.hook
    matcher: "Edit|Write|MultiEdit|NotebookEdit|Bash|Skill"
    timeout: 10
  stop:
    command: speckit.blueprint.hook
    timeout: 30

tags:
  - "blueprint"
  - "discovery"
  - "research"
  - "planning"
  - "multi-repo"
  - "claude"

defaults:
  blueprint_path: "docs/BLUEPRINT.md"
  guard: true
