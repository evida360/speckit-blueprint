    let dated = false; // the first label shown carries the date; later ones only at midnight
    const grid = tk.list.map(t => {
      const xx = x(t), d = new Date(t), day = tk.step >= 864e5 || (d.getHours() === 0 && d.getMinutes() === 0);
      const lab = day ? fdate(t) : dated ? ftime(t) : `${fdate(t)} ${ftime(t)}`, w = lab.length * 6.4;
      const fits = xx - w / 2 >= L - 8 && xx + w / 2 <= W;
      if (fits && lab !== ftime(t)) dated = true;
      return html`<line class="grid" x1="${f1(xx)}" x2="${f1(xx)}" y1="${top - 4}" y2="${H - 24}"/>${fits ? html`<text class="axis" x="${f1(xx)}" y="${H - 8}" text-anchor="middle">${lab}</text>` : ''}`;
    });
    const table = [], body = [];
    const diamond = (cx, cy, r, cls) => html`<path class="${cls}" d="M${f1(cx)},${f1(cy - r)}L${f1(cx + r)},${f1(cy)}L${f1(cx)},${f1(cy + r)}L${f1(cx - r)},${f1(cy)}Z"/>`;
    let y = top;
    for (const r of rows) {
      const h = rowH(r);
      if (r.group) { body.push(html`<text class="grp" x="0" y="${y + 20}">${clip(r.group, Math.floor((L - 8) / 7))}</text>`); y += h; continue; }
      const sprint = !!r.s, mid = y + h / 2, barH = sprint ? 8 : 12, by = mid - barH / 2;
      const name = sprint ? `${sprintId(r.s)} ${r.s.milestone || ''}`.trim() : `${r.e.id || '?'} ${r.e.title || ''}`.trim();
      const marks = [], px = [];
      if (sprint && r.s.status === 'current') marks.push(html`<rect class="band" x="${L}" y="${y + 2}" width="${f1(W - L - R)}" height="${h - 4}" rx="4"/>`);
      for (const [s, t] of r.spans) { // merge stretches closer than a pixel apart
        const a = x(s), b2 = Math.max(x(t), a + 2), last = px[px.length - 1];
        if (last && a - last[1] < 1.5) last[1] = Math.max(last[1], b2); else px.push([a, b2]);
      }
      px.forEach(([a, b2]) => marks.push(html`<rect class="act" x="${f1(a)}" y="${f1(by)}" width="${f1(b2 - a)}" height="${barH}" rx="2"/>`));
      const tip = [sprint ? `${sprintName(r.s)} · ${r.s.milestone || ''}` : name];
      const worked = r.spans.length ? `${fstamp(r.spans[0][0])} – ${fstamp(r.spans[r.spans.length - 1][1])}` : '';
      if (worked) tip.push(`Worked ${worked} (${plural(r.spans.length, 'stretch', 'stretches')} of activity)`);
      if (r.f) {
        const a = x(r.f.s50), m = Math.max(x(r.f.e50), a + 2), z = Math.max(x(r.f.e90), m);
        if (z > m + 0.5) marks.push(html`<rect class="fc90" x="${f1(m)}" y="${f1(by)}" width="${f1(z - m)}" height="${barH}" rx="2"/>`);
        marks.push(html`<rect class="fc" x="${f1(a)}" y="${f1(by)}" width="${f1(m - a)}" height="${barH}" rx="2"/>`);
        if (sprint) marks.push(diamond(m, mid, 6, 'ms-fc'));
        tip.push(`Forecast: ${sprint ? 'its last epic is ' : 'starts ' + fstamp(r.f.s50) + ', '}done ${fstamp(r.f.e50)} (P50) – ${fstamp(r.f.e90)} (P90)`);
      } else if (sprint ? r.s.done : r.e.state === 'done') {
        tip.push('Done');
        if (sprint && r.s.last) marks.push(diamond(x(r.s.last), mid, 6, 'ms-done'));
      } else tip.push('No forecast yet');
      if (sprint) tip.push(`${r.s.nDone} of ${plural(r.s.n, 'epic')} · ${r.s.acsDone} of ${r.s.acs} ACs done`);
      if (!sprint && r.e.critical) tip.push('On the critical path');
      const done = sprint ? r.s.done : r.e.state === 'done';
      table.push([sprint ? html`<strong>${name}</strong>` : name, worked || '—', r.f ? fstamp(r.f.e50) : done ? 'done' : '—', r.f ? fstamp(r.f.e90) : '—']);
      const t = tip.join('\n'), indent = r.inner ? 14 : 0, maxCh = Math.floor((L - 10 - indent) / (sprint ? 7 : 6.6));
      const key = sprint ? `${r.b.id}:${r.s.label}` : keyOf(r.b, r.e);
      body.push(html`<g class="row" tabindex="0" id="${domId(sprint ? 'tls' : 'tl', key)}" data-tip="${t}" aria-label="${t}"><rect class="hit" x="0" y="${y}" width="${W}" height="${h}"/>${r.inner && r.e.critical ? html`<text class="axis" x="2" y="${mid + 4}">◆</text>` : ''}<text class="lbl${sprint ? ' sprint' : ''}" x="${indent}" y="${mid + 4}">${clip(name, maxCh)}</text>${marks}</g>`);
      y += h;
    }
    const nx = f1(x(now));
    const one = sel.length === 1;
    return html`<div class="card-h"><h2>Timeline</h2><span class="lede">${one ? 'Sprints with their epics; finished sprints fold into one row' : 'One row per sprint; pick a blueprint to see its epics'}</span></div>
      <div class="legend" style="margin:0 0 10px"><span><i class="sw act"></i>Worked</span><span><i class="sw fc"></i>Forecast (P50)</span><span><i class="sw fc90"></i>Up to P90</span><span><i class="sw dia" style="background:var(--good)"></i>Sprint done</span><span><i class="sw dia" style="background:var(--s1)"></i>Sprint forecast</span>${one ? html`<span>◆ Critical path</span>` : ''}<span><i class="sw line"></i>Now</span></div>
      <svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Timeline of sprints and epics: worked time and forecast">${grid}${body}
      <line class="now" x1="${nx}" x2="${nx}" y1="${top - 6}" y2="${H - 24}"/><text class="axis" x="${nx}" y="${top - 10}" text-anchor="middle">now</text></svg>
      ${tableView('tv:timeline', ['Sprint or epic', 'Worked', 'Forecast done (P50)', 'Forecast done (P90)'], table)}`;
  }

  function barPath(x, y, w, h, r) { // square at the baseline, rounded data end
    const f = n => n.toFixed(1);
    r = Math.max(0, Math.min(r, w, h / 2));
    return r ? `M${f(x)},${y}h${f(w - r)}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 ${-r},${r}h${f(r - w)}z` : `M${f(x)},${y}h${f(w)}v${h}h${f(-w)}z`;
  }

  function breakdown(st) {
    const NAMES = ['Model', 'Tools and tests', 'Waiting for you'], items = [];
    for (const b of selected(st)) for (const e of ordered(b)) {
      const a = obj(e.actual), v = [num(a.model_s), num(a.tool_s), num(a.wait_s)];
      const name = `${ctx.multi ? `${b.id}:` : ''}${e.id || '?'} ${e.title || ''}`.trim();
      if (v[0] + v[1] + v[2] > 0) items.push({ b, e, v, name, total: v[0] + v[1] + v[2] });
    }
    if (!items.length) return html`<div class="card-h"><h2>Where the time went</h2></div><p class="empty">No recorded time yet.</p>`;
    const totals = [0, 1, 2].map(k => sum(items, it => it.v[k])), agent = totals[0] + totals[1];
    const headline = totals[2] > 0 && agent > 0
      ? html`<p class="headline">Sessions waited <b>${cal(totals[2])}</b> for your answers, ${totals[2] >= agent ? html`<b>${(totals[2] / agent).toFixed(1)}×</b> the agent’s own` : html`against the agent’s`} <b>${dur(agent)}</b> of work.</p>` : '';
    const W = chartWidth(), L = Math.min(230, Math.round(W * 0.32)), R = 70, rowH = 30, barH = 16, H = items.length * rowH;
    const max = Math.max(...items.map(i => i.total)), sx = v => (v / max) * (W - L - R);
    const rows = items.map((it, i) => {
      const y = i * rowH + (rowH - barH) / 2, last = it.v.map((v, k) => (v > 0 ? k : -1)).filter(k => k >= 0).pop();
      const segs = [];
      let x0 = L;
      it.v.forEach((v, k) => {
        if (v <= 0) return;
        const w = sx(v), vis = Math.max(1, w - (k === last ? 0 : 2)), text = dur(v);
        segs.push(html`<path class="m${k + 1}" d="${barPath(x0, y, vis, barH, k === last ? 4 : 0)}"/>`);
        if (text.length * 6.6 + 10 <= vis) segs.push(html`<text class="in" x="${(x0 + 5).toFixed(1)}" y="${y + barH - 4}">${text}</text>`);
        x0 += w;
      });
      const tip = [it.name, ...NAMES.map((n, k) => `${n}: ${dur(it.v[k])} (${Math.round((100 * it.v[k]) / it.total)}%)`), `Total: ${dur(it.total)}`].join('\n');
      return html`<g class="row" tabindex="0" id="${domId('tb', keyOf(it.b, it.e))}" data-tip="${tip}" aria-label="${tip}"><rect class="hit" x="0" y="${i * rowH}" width="${W}" height="${rowH}"/><text class="lbl" x="0" y="${y + barH - 4}">${clip(it.name, Math.floor((L - 10) / 6.6))}</text>${segs}<text class="axis" x="${(x0 + 6).toFixed(1)}" y="${y + barH - 4}">${dur(it.total)}</text></g>`;
    });
    return html`<div class="card-h"><h2>Where the time went</h2><span class="lede">Each session’s time, by epic</span></div>${headline}<div class="legend" style="margin:0 0 10px">${NAMES.map((n, k) => html`<span><i class="sw m${k + 1}"></i>${n}</span>`)}</div>
      <svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Where each epic's time went">${rows}</svg>
      ${tableView('tv:breakdown', ['Epic', ...NAMES, 'Total'], items.map(it => [it.name, ...it.v.map(v => dur(v)), dur(it.total)]))}`;
  }

  // What an AC cost in each finished epic: the rates every estimate multiplies by (estimate.py uses every blueprint's)
  function rates(st) {
    const pts = [];
    for (const b of blueprints(st)) for (const e of epicsOf(b)) {
      const a = obj(e.actual);
      if (e.state !== 'done' || !num(a.sessions) || !isNum(a.cost_usd) || !num(e.acs)) continue;
      pts.push({ b, e, v: a.cost_usd / e.acs, t: num(a.agent_s) / e.acs, mine: ui.bp === 'all' || b.id === ui.bp });
    }
    if (pts.length < 3) return '';
    const vals = pts.map(p => p.v).sort((p, q) => p - q);
    const q = p => { const pos = (vals.length - 1) * p, lo = Math.floor(pos), hi = Math.min(lo + 1, vals.length - 1); return vals[lo] + (vals[hi] - vals[lo]) * (pos - lo); };
    const p50 = q(0.5), p90 = q(0.9);
    const steps = [1, 2, 5, 10, 20, 50, 100], top = vals[vals.length - 1];
    const step = steps.find(s => top / s <= 6) || 200, max = Math.ceil(top / step) * step;
    const W = chartWidth(), L = 10, R = 24, r = 5, gapY = 2 * r + 3;
    const x = v => L + (v / max) * (W - L - R);
    // a dot strip: each dot takes the nearest free level to the centre line, so none overlaps another
    const placed = [];
    for (const p of pts.slice().sort((a, b) => a.v - b.v)) {
      const px = x(p.v);
      for (let k = 0; ; k++) {
        const lvl = k === 0 ? 0 : (k % 2 ? 1 : -1) * Math.ceil(k / 2);
        if (!placed.some(o => o.lvl === lvl && Math.abs(o.px - px) < 2 * r + 2)) { placed.push({ ...p, px, lvl }); break; }
      }
    }
    const lvMax = Math.max(1, ...placed.map(p => Math.abs(p.lvl)));
    const mid = 30 + lvMax * gapY, H = mid + lvMax * gapY + 40;
    const many = ui.bp === 'all' && blueprints(st).length > 1, bps = blueprints(st).map(b => b.id);
    const cls = p => (many ? `m${(bps.indexOf(p.b.id) % 3) + 1}` : p.mine ? 'm1' : 'de');
    const f1 = n => n.toFixed(1);
    const axis = [];
    for (let v = 0; v <= max + 1e-9; v += step) axis.push(html`<line class="grid" x1="${f1(x(v))}" x2="${f1(x(v))}" y1="18" y2="${H - 26}"/><text class="axis" x="${f1(x(v))}" y="${H - 10}" text-anchor="middle">$${v}</text>`);
    const ref = (v, label, anchorEnd) => html`<line class="ref" x1="${f1(x(v))}" x2="${f1(x(v))}" y1="14" y2="${H - 26}"/><text class="axis" x="${f1(x(v) + (anchorEnd ? -4 : 4))}" y="12" text-anchor="${anchorEnd ? 'end' : 'start'}">${label}</text>`;
    const close = Math.abs(x(p90) - x(p50)) < 80;
    // name the costliest few above P90; a name that would run into one already placed goes under its dot
    const outliers = placed.slice().sort((a, b) => b.v - a.v).slice(0, 4).filter(p => p.v > p90);
    const boxes = [];
    for (const p of outliers) {
      p.name = `${ctx.multi ? `${p.b.id}:` : ''}${p.e.id}`;
      const w = p.name.length * 6.6 + 6, lo = p.px - w / 2, hi = p.px + w / 2;
      p.below = boxes.some(([a, z, below]) => !below && lo < z && hi > a);
      boxes.push([lo, hi, p.below]);
    }
    const dots = placed.sort((a, b) => Number(a.mine) - Number(b.mine)).map(p => {
      const tip = `${p.b.id}:${p.e.id} ${p.e.title || ''}\n${money(p.v)} per AC · ${dur(p.t)} agent time per AC\n${plural(num(p.e.acs), 'AC')} · ${money(obj(p.e.actual).cost_usd, obj(p.e.actual).cost_estimated)} in all`;
      return html`<g class="row" tabindex="0" data-tip="${tip}" aria-label="${tip}"><circle class="hit" cx="${f1(p.px)}" cy="${f1(mid + p.lvl * gapY)}" r="${r + 5}"/><circle class="${cls(p)} dot-a" cx="${f1(p.px)}" cy="${f1(mid + p.lvl * gapY)}" r="${r}"/></g>`;
    });
    const labels = outliers.map(p => html`<text class="axis" x="${f1(p.px)}" y="${f1(mid + p.lvl * gapY + (p.below ? r + 14 : -r - 5))}" text-anchor="middle">${p.name}</text>`);
    const legend = many ? html`<div class="legend" style="margin:0 0 6px">${blueprints(st).map((b, i) => html`<span><i class="sw m${(i % 3) + 1}" style="border-radius:50%"></i>${bpName(b)}</span>`)}</div>`
      : ui.bp !== 'all' ? html`<div class="legend" style="margin:0 0 6px"><span><i class="sw m1" style="border-radius:50%"></i>This blueprint</span><span><i class="sw de" style="border-radius:50%"></i>Other blueprints</span></div>` : '';
    const sorted = pts.slice().sort((a, b) => b.v - a.v);
    return html`<div class="card-h"><h2>What an acceptance criterion costs</h2><span class="lede">Finished epics; every estimate multiplies an epic’s ACs by these rates</span></div>
      <p class="headline">Half of the finished epics cost under <b>${money(p50)}</b> per AC; one in ten cost over <b>${money(p90)}</b>. That spread is why the remaining cost is a range.</p>${legend}
      <svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Cost per acceptance criterion of each finished epic">${axis}<line class="base" x1="${L}" x2="${W - R}" y1="${H - 26}" y2="${H - 26}"/>${ref(p50, `P50 ${money(p50)}`, true)}${ref(p90, `P90 ${money(p90)}`, !close ? true : false)}${dots}${labels}</svg>
      ${tableView('tv:rates', ['Epic', 'Per AC', 'Agent time per AC', 'ACs', 'Cost'], sorted.map(p => [`${p.b.id}:${p.e.id} ${p.e.title || ''}`, money(p.v), dur(p.t), num(p.e.acs), money(obj(p.e.actual).cost_usd, obj(p.e.actual).cost_estimated)]))}`;
  }

  // ---------- repositories, discovery, footer ----------
  function repos(st) {
    const list = arr(st.repositories).filter(r => r && typeof r === 'object');
    if (!list.length) return '';
    const row = r => {
      const eps = arr(r.epics_in_progress);
      const chips = eps.map(k => { const hit = ctx.index.get(k); return html`<span class="chip${inBp(k) ? '' : ' dim'}" title="${hit && hit.e.title ? hit.e.title : ''}">${epicRef(k)}${hit && hit.e.title ? ` ${clip(String(hit.e.title), 34)}` : ''}</span>`; });
      const path = String(r.path || '').replace(/^\/(?:Users|home)\/[^/]+(?=\/)/, '~');
      return html`<tr><td class="repo-name"><strong>${r.name || '?'}</strong>${r.hub ? html` <span class="chip">hub</span>` : ''}<span class="meta" title="${r.path || ''}">${path}</span></td>
        <td class="gate">${r.gate ? html`<code>${r.gate}</code>` : html`<span class="muted">none</span>`}</td>
        <td>${chips.length ? chips : html`<span class="muted">none</span>`}${eps.length > 1 ? html`<span class="warnline">${eps.length} epics change it in parallel</span>` : ''}</td></tr>`;
    };
    const busy = list.filter(r => arr(r.epics_in_progress).length).sort((a, b) => arr(b.epics_in_progress).length - arr(a.epics_in_progress).length);
    const idle = list.filter(r => !arr(r.epics_in_progress).length);
    return html`<div class="card-h"><h2>Repositories</h2><span class="lede">${plural(busy.length, 'repository', 'repositories')} with work in progress, ${idle.length} idle</span></div>
      <div class="scroll"><table><thead><tr><th>Repository</th><th>Gate</th><th>Epics in progress</th></tr></thead><tbody>${busy.concat(idle).map(row)}</tbody></table></div>`;
  }

  function discovery(st) {
    const rows = [];
    for (const b of selected(st)) for (const [kind, d] of Object.entries(obj(b.discovery))) rows.push({ b, kind, d: obj(d) });
    if (!rows.length) return '';
    const kindName = k => (k === 'discover' ? 'Discovery' : k === 'amend' ? 'Amendments' : k);
    return html`<div class="card-h"><h2>Discovery and amendments</h2></div><div class="scroll"><table><thead><tr>${ctx.multi ? html`<th>Blueprint</th>` : ''}<th>Work</th><th class="num">Agent time</th><th class="num">Waited for you</th><th class="num">Sessions</th><th class="num">Tokens</th><th class="num">Cost</th></tr></thead>
      <tbody>${rows.map(r => html`<tr>${ctx.multi ? html`<td>${bpName(r.b)}</td>` : ''}<td>${kindName(r.kind)}</td><td class="num">${dur(r.d.agent_s)}</td><td class="num">${dur(r.d.wait_s)}</td><td class="num">${isNum(r.d.sessions) ? r.d.sessions : '—'}</td><td class="num">${tok(r.d.tokens)}</td><td class="num">${costOf(r.d.cost_usd, r.d.cost_estimated, r.d.sessions)}</td></tr>`)}</tbody></table></div>`;
  }

  function footer(st) {
    const g = ts(st.generated);
    return html`State generated ${g ? `${fdate(g)} ${ftime(g)}` : '—'} · metrics: ${st.metrics || 'local'}${SNAPSHOT ? '' : ' · refreshes every 3 s'} · speckit-blueprint`;
  }

  // ---------- rendering: a section's DOM is replaced only when its markup changed ----------
  function put(id, content) {
    const el = document.getElementById(id), s = part(content);
    if (!el || el._html === s) return;
    el._html = s;
    el.innerHTML = s;
    if (el.tagName === 'SECTION' || el.tagName === 'NAV') el.hidden = !s;
  }

  function render() {
    const st = ui.state, y = window.scrollY, active = document.activeElement, focusId = active && active.id;
    if (st) prepare(st);
    put('banners', banners(st));
    if (st) {
      document.title = `${st.project || 'Project'} · blueprint dashboard`;
      put('hdr', header(st));
      put('tabs', tabs(st));
      put('needs', needs(st));
      put('kpis', kpis(st));
      put('sprints', sprints(st));
      put('sessions', sessions(st));
      put('epics', epicsSection(st));
      put('timeline', timeline(st));
      put('breakdown', breakdown(st));
      put('rates', rates(st));
      put('repos', repos(st));
      put('discovery', discovery(st));
      put('foot', footer(st));
    }
    if (focusId && document.activeElement !== active) { const el = document.getElementById(focusId); if (el && el.focus) el.focus({ preventScroll: true }); }
    if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
    tickLive();
  }

  function safeRender() {
    const fatal = document.getElementById('fatal');
    try { render(); fatal.hidden = true; } catch (err) {
      console.error(err);
      fatal.textContent = `The page could not show this state: ${err && err.message ? err.message : err}`;
      fatal.hidden = false;
    }
  }

  // The clock of the last update keeps one width (HH:MM:SS), so nothing beside it moves; how long ago is in its tooltip.
  function tickLive() {
    const el = document.getElementById('live');
    if (!el) return;
    const clock = t => `${ftime(t)}:${pad2(new Date(t).getSeconds())}`;
    let cls = 'live', text, title = '';
    if (SNAPSHOT) { const g = ui.state && ts(ui.state.generated); cls += ' snap'; text = `Snapshot · ${g ? `${fdate(g)} ${ftime(g)}` : 'time unknown'}`; }
    else if (!ui.lastOk) { cls += ui.error ? ' bad' : ''; text = ui.error ? 'Not connected' : 'Connecting…'; }
    else {
      const age = (Date.now() - ui.lastOk) / 1000;
      if (age * 1000 > STALE_MS) { cls += ' stale'; text = `Stale · ${clock(ui.lastOk)}`; title = `No update for ${dur(age)}. Is blueprint.py dashboard still running?`; }
      else { cls += ' ok'; text = `Live · ${clock(ui.lastOk)}`; title = `Updated ${age < 1 ? 'just now' : `${dur(age)} ago`}; the page asks every 3 s`; }
    }
    if (el.className !== cls) el.className = cls;
    if (el.textContent !== text) el.textContent = text;
    if (el.title !== title) el.title = title;
  }

  async function poll() {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data && typeof data === 'object' && !Array.isArray(data) && !data.error) { ui.state = data; ui.error = null; ui.lastOk = Date.now(); }
      else ui.error = data && data.error ? String(data.error) : 'The server sent an unexpected answer.';
    } catch (err) {
      ui.error = `Cannot reach /api/state (${err && err.message ? err.message : err}).`;
    }
    safeRender();
    setTimeout(poll, POLL_MS);
  }

  // ---------- events ----------
  document.addEventListener('click', ev => {
    const fold = ev.target && ev.target.closest ? ev.target.closest('[data-fold]') : null;
    if (fold && ui.state) { // open or close every sprint group of a blueprint in the epics list
      const b = blueprints(ui.state).find(x => x.id === fold.getAttribute('data-of'));
      if (b) for (const s of sprintsOf(b)) ui.groups.set(sprintKey(b, s), fold.getAttribute('data-fold') === 'open');
      safeRender();
      return;
    }
    const t = ev.target && ev.target.closest ? ev.target.closest('[data-bp]') : null;
    if (!t) return;
    ui.bp = t.getAttribute('data-bp') || 'all';
    try { history.replaceState(null, '', ui.bp === 'all' ? location.pathname + location.search : `#bp=${encodeURIComponent(ui.bp)}`); } catch (_) { /* file: URLs may refuse */ }
    safeRender();
  });
  window.addEventListener('hashchange', () => { // a link to #bp=desk switches the tab without a reload
    const m = /(?:^#|&)bp=([^&]*)/.exec(location.hash || '');
    let bp = 'all';
    if (m) { try { bp = decodeURIComponent(m[1]) || 'all'; } catch (_) { bp = 'all'; } }
    if (bp !== ui.bp) { ui.bp = bp; safeRender(); }
  });
  document.addEventListener('toggle', ev => { // remember which epics, sprint groups and table views are expanded
    const d = ev.target;
    if (!d || d.tagName !== 'DETAILS' || !d.dataset) return;
    if (d.dataset.group) ui.groups.set(d.dataset.group, d.open);
    else if (d.dataset.key) { if (d.open) ui.open.add(d.dataset.key); else ui.open.delete(d.dataset.key); }
  }, true);

  const tip = document.getElementById('tip');
  const hideTip = () => { tip.hidden = true; };
  function showTip(target, x, y) {
    const text = target.getAttribute('data-tip');
    if (!text) return hideTip();
    if (tip.textContent !== text) tip.textContent = text;
    tip.hidden = false;
    tip.style.left = `${Math.max(8, Math.min(x + 14, window.innerWidth - tip.offsetWidth - 8))}px`;
    tip.style.top = `${y + 18 + tip.offsetHeight > window.innerHeight ? y - tip.offsetHeight - 10 : y + 18}px`;
  }
  const tipTarget = ev => (ev.target && ev.target.closest ? ev.target.closest('[data-tip]') : null);
  document.addEventListener('pointermove', ev => { const t = tipTarget(ev); if (t) showTip(t, ev.clientX, ev.clientY); else hideTip(); });
  document.addEventListener('focusin', ev => { const t = tipTarget(ev); if (!t) return hideTip(); const r = t.getBoundingClientRect(); showTip(t, r.left + Math.min(r.width / 2, 260), r.top + 8); });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, { passive: true });
  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(safeRender, 150); });

  // ---------- start ----------
  if (SNAPSHOT) {
    const s = window.__STATE__;
    if (s && typeof s === 'object' && !s.error) ui.state = s;
    else ui.error = s && s.error ? String(s.error) : 'The exported file holds no state.';
    safeRender();
  } else {
    safeRender();
    poll();
    setInterval(tickLive, 1000);
  }
})();
</script>
</body>
</html>
