<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint dashboard</title>
<!--
  speckit-blueprint dashboard: one self-contained page (no external resources).
  Live: `blueprint.py dashboard` serves this file at / and the state at /api/state; the page polls every 3 s.
  Export: the server puts `window.__STATE__` into the placeholder comment before the main script; the page
  then renders that snapshot once and never polls.
-->
<style>
/* Layout: a sticky bar with the blueprint tabs; what needs you and the four figures; the sprint plan, its bars
   sized by acceptance criteria; the epics grouped by sprint; the timeline by sprint; where the time and the money
   went; the repositories. State colors mean the same thing everywhere: done, building, review, ready, blocked. */
:root {
  color-scheme: light;
  --bg: #f3f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6b6a65;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, .10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --act: #2a78d6; --fc: #86b6ef; --fc90: #b7d3f6;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --violet: #6250d6;
  --good-ink: #006300; --crit-ink: #b42323; --warn-bg: #fff5dc; --crit-bg: #fdeceb; --info-bg: #eaf2fc; --focus: #2a78d6;
  --ready: #b4b3ab; --blocked: #e4e3dc; --size: #a3a29b; --on-fill: #ffffff; --on-light: #0b0b0b; --shadow: rgba(11, 11, 11, .14); --band-hover: #e8e7e3;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #262624; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9c9b94;
    --grid: #2c2c2a; --axis: #4a4a46; --border: rgba(255, 255, 255, .10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --act: #86b6ef; --fc: #3987e5; --fc90: #184f95;
    --violet: #9085e9; --good-ink: #3fc23f; --crit-ink: #f08a8a; --warn-bg: #33270d; --crit-bg: #3a1717; --info-bg: #142338; --focus: #6da7ec;
    --ready: #5f5e59; --blocked: #30302d; --size: #6b6a65; --on-light: #f0efec; --shadow: rgba(0, 0, 0, .5); --band-hover: #2e2e2b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
main { max-width: 1240px; margin: 0 auto; padding: 0 24px 40px; }
h1 { font-size: 18px; margin: 0; font-weight: 650; line-height: 1.2; }
h2 { font-size: 15px; margin: 0; font-weight: 650; text-wrap: balance; }
h4 { font-size: 12.5px; margin: 14px 0 6px; color: var(--ink-2); font-weight: 600; }
code { font: 12px/1.35 var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.meta { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.empty { color: var(--muted); margin: 4px 0; }
.nowrap { white-space: nowrap; }

/* the sticky bar: brand and tabs hold their place; the live clock has a fixed width at the far end */
header.top { position: sticky; top: 0; z-index: 6; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; column-gap: 28px; row-gap: 10px; margin: 0 -24px 16px; padding: 12px 24px; background: var(--bg); border-bottom: 1px solid var(--grid); }
.brand { display: grid; gap: 1px; grid-column: 1; grid-row: 1; }
.sub { font-size: 12.5px; color: var(--ink-2); }
.tabs { grid-column: 2; grid-row: 1; justify-self: start; display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 9px; }
.tab { font: inherit; font-size: 13px; color: var(--ink-2); background: none; border: 0; border-radius: 7px; padding: 4px 12px; cursor: pointer; display: inline-flex; align-items: baseline; gap: 7px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px var(--shadow); }
.tab .pct { font-size: 11.5px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; min-width: 3.2ch; text-align: right; }
.live { grid-column: 4; grid-row: 1; min-width: 10.5em; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--axis); flex: none; }
.live.ok::before { background: var(--good); }
.live.stale::before { background: var(--warn); }
.live.bad::before { background: var(--crit); }
.live.stale, .live.bad { color: var(--ink); font-weight: 600; }

.banner { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; background: var(--surface); }
.banner.err { background: var(--crit-bg); }
.banner.warn { background: var(--warn-bg); }
.banner.info { background: var(--info-bg); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
.kpi, section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
section.card { margin: 0 0 16px; }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 12px; }
.card-h .lede { font-size: 12.5px; color: var(--muted); }
.kpi .lbl { font-size: 12.5px; color: var(--ink-2); }
.kpi .val { font-size: 26px; font-weight: 600; line-height: 1.15; margin: 4px 0 8px; }
.kpi .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.meter { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-bottom: 8px; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.count { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; }
table.mini { font-size: 13px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
.dot.working { background: var(--good); }
.dot.waiting { background: var(--warn); }
.chip { display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-2); margin: 1px 4px 1px 0; white-space: nowrap; }
.chip.dim { opacity: .6; }
.chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--axis); vertical-align: 0; }
.chip.c-done i { background: var(--good); }
.chip.c-open i { background: var(--warn); }
.ok { color: var(--good-ink); }
.bad { color: var(--crit-ink); }
.warnline { display: block; margin: 3px 0 0; font-size: 12.5px; color: var(--ink); font-weight: 400; }
.warnline::before { content: "!"; display: inline-block; width: 15px; height: 15px; line-height: 15px; text-align: center; border-radius: 50%; background: var(--warn); color: #0b0b0b; font-size: 11px; font-weight: 700; margin-right: 6px; }

/* state, everywhere: a dot and a word in pills, a fill in bars */
.badge { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); font-size: 12px; white-space: nowrap; }
.badge i, .lg i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.st-done i, .blk.st-done { background: var(--good); }
.st-building i, .st-elsewhere i, .blk.st-building, .blk.st-elsewhere { background: var(--s1); }
.st-review i, .blk.st-review { background: var(--violet); }
.st-stale i, .blk.st-stale { background: var(--serious); }
.st-ready i, .blk.st-ready { background: var(--ready); }
.st-blocked i, .blk.st-blocked { background: var(--blocked); }
.badge.st-blocked i, .lg.st-blocked i { box-shadow: inset 0 0 0 1px var(--axis); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 12px; height: 12px; border-radius: 3px; }

/* needs you */
.needs { list-style: none; margin: 0; padding: 0; }
.nd { display: grid; grid-template-columns: 128px minmax(0, 1fr) minmax(0, auto); gap: 2px 16px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--grid); }
.nd:first-child { border-top: 0; padding-top: 0; }
.nd:last-child { padding-bottom: 0; }
.nd-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.nd-tag i { flex: none; width: 9px; height: 9px; border-radius: 50%; }
.t-wait .nd-tag i { background: var(--warn); }
.t-fix .nd-tag i { background: var(--serious); }
.t-next .nd-tag i { background: var(--s1); }
.t-ready .nd-tag i { box-shadow: inset 0 0 0 2px var(--s1); }
.t-check .nd-tag i { box-shadow: inset 0 0 0 2px var(--muted); }
.nd-main { min-width: 0; overflow-wrap: anywhere; }
.nd-main strong { font-weight: 600; }
.nd-cmd { justify-self: end; text-align: right; min-width: 0; }
.nd-cmd code { white-space: normal; }

/* disclosure: a chevron for blueprints and sprints, a small caret for epics */
.chev { flex: none; width: 16px; height: 16px; display: inline-grid; place-items: center; }
.chev::before { content: ""; width: 6px; height: 6px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(-45deg); transition: transform .15s; margin-left: -2px; }
details[open] > summary > .chev::before { transform: rotate(45deg); margin: -3px 0 0; }
summary.flat { list-style: none; cursor: pointer; }
summary.flat::-webkit-details-marker { display: none; }

/* a blueprint, folded (several blueprints at once) */
details.bpg { border: 1px solid var(--grid); border-radius: 10px; }
details.bpg + details.bpg { margin-top: 10px; }
details.bpg > summary { display: grid; grid-template-columns: 16px minmax(0, 1fr) 220px 200px; align-items: center; gap: 4px 16px; padding: 12px 14px; border-radius: 10px; }
details.bpg > summary:hover { background: var(--surface-2); }
details.bpg[open] > summary { border-bottom: 1px solid var(--grid); border-radius: 10px 10px 0 0; }
.bpg-name { display: grid; gap: 2px; min-width: 0; }
.bpg-t { font-size: 15px; font-weight: 650; }
.bpg-s { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.bpg-m { justify-self: end; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bpg-m b { color: var(--ink); font-weight: 600; }
.bpg-body { padding: 12px 14px 8px; }
.ribbon { display: flex; gap: 2px; width: 100%; height: 8px; }
.rb { flex: 1 1 0; min-width: 3px; height: 100%; border-radius: 2px; overflow: hidden; background: var(--blocked); }
.rb i { display: block; height: 100%; background: var(--good); }
.rb.rb-cur { background: var(--fc90); }

/* sprints */
.sp-group + .sp-group { margin-top: 22px; }
details.sp-fold { border-bottom: 1px solid var(--grid); }
details.sp-fold > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 0; border-radius: 6px; }
details.sp-fold > summary:hover { background: var(--surface-2); }
.fold-t { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink-2); }
.fold-m { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
details.sp-fold[open] > summary { border-bottom: 1px solid var(--grid); border-radius: 6px 6px 0 0; }
details.sp-fold .sp:last-child { border-bottom: 0; }
.sp-head, .sp { display: grid; grid-template-columns: 236px minmax(0, 1fr) 112px 156px; gap: 6px 18px; align-items: center; }
.sp-head { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 0 0 6px; border-bottom: 1px solid var(--grid); }
.sp { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.sp:last-child { border-bottom: 0; }
.sp-name { min-width: 0; display: grid; gap: 3px; }
.sp-top { display: flex; align-items: center; gap: 8px; }
.sp-id { font: 600 12px/1.4 var(--mono); color: var(--ink-2); }
.sp-ms { font-weight: 600; overflow-wrap: anywhere; text-wrap: balance; }
.sp.s-done .sp-ms { font-weight: 500; color: var(--ink-2); }
.pill { font-size: 11px; font-weight: 600; line-height: 1.6; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.p-current { background: var(--info-bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--s1); }
.pill.p-done { color: var(--good-ink); }
.sp-plan { min-width: 0; }
.segbar { display: flex; gap: 2px; height: 22px; }
.blk { flex: 0 1 auto; min-width: 4px; height: 100%; border-radius: 4px; display: flex; align-items: center; padding: 0 6px; overflow: hidden; font: 600 11px/1 var(--mono); white-space: nowrap; color: var(--on-fill); }
.blk.st-stale { color: #0b0b0b; }
.blk.st-ready { color: var(--on-light); }
.blk.st-blocked { color: var(--muted); }
.sp-exit { font-size: 12px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.sp-exit b { font-weight: 600; color: var(--ink-2); }
.sp-fig, .sp-when { font-size: 13px; font-variant-numeric: tabular-nums; }
.sp-fig b { font-size: 15px; font-weight: 600; }
.sp-when b { font-weight: 600; }

/* epics: a sprint is a filled band; its epics hang under it, indented on a guide line */
.ep-group + .ep-group { margin-top: 26px; }
.bphead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 0 0 10px; }
.next { font-size: 13px; color: var(--ink-2); }
.tools { margin-left: auto; display: inline-flex; gap: 4px; }
.tool { font: inherit; font-size: 12.5px; color: var(--ink-2); background: none; border: 1px solid var(--grid); border-radius: 6px; padding: 2px 9px; cursor: pointer; }
.tool:hover { color: var(--ink); background: var(--surface-2); }
.ep-cols, details.epic > summary { display: grid; grid-template-columns: minmax(0, 1fr) 150px 124px 136px 104px 116px; gap: 14px; align-items: start; padding: 8px 8px; }
.ep-cols { font-size: 12px; font-weight: 600; color: var(--ink-2); padding-top: 0; padding-bottom: 6px; }
.ep-cols.indent { margin-left: 20px; }
details.sg { margin: 8px 0 0; }
details.sg > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 9px 12px 9px 8px; background: var(--surface-2); border-radius: 8px; }
details.sg > summary:hover { background: var(--band-hover); }
details.sg.s-current > summary { background: var(--info-bg); }
.sp-chip { font: 600 11.5px/1.6 var(--mono); padding: 0 6px; border-radius: 5px; background: var(--surface); color: var(--ink); }
.sg-title { font-size: 14px; font-weight: 650; }
.sg-meter { flex: none; width: 72px; height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; }
.sg-meter i { display: block; height: 100%; background: var(--good); }
.sg-m { margin-left: auto; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sg-body { margin: 2px 0 4px 18px; border-left: 2px solid var(--grid); }
details.epic { border-top: 1px solid var(--grid); }
.sg-body > details.epic:first-child { border-top: 0; }
details.epic > summary { cursor: pointer; list-style: none; border-radius: 6px; }
details.epic > summary::-webkit-details-marker { display: none; }
details.epic > summary:hover { background: var(--surface-2); }
summary:focus-visible, select:focus-visible, .tab:focus-visible, g.row:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.c-title { position: relative; padding-left: 18px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.c-title::before { content: ""; position: absolute; left: 3px; top: 5px; border: 5px solid transparent; border-left: 6px solid var(--muted); transition: transform .15s; transform-origin: 3px 5px; }
details.epic[open] > summary .c-title::before { transform: rotate(90deg); }
.eid { font: 600 12.5px var(--mono); color: var(--ink-2); margin-right: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; font-size: 12px; font-weight: 400; color: var(--muted); }
.tag-cp::before { content: "◆"; color: var(--ink); margin-right: 4px; font-size: 10px; }
.tags .warnline { margin: 0; font-size: 12px; }
.c-num { text-align: right; font-variant-numeric: tabular-nums; }
.c-size { display: flex; align-items: center; gap: 8px; }
.sz { flex: none; width: 22px; text-align: center; font: 600 11px/18px var(--mono); border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.sbar { flex: 1; height: 6px; border-radius: 3px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--size); border-radius: 0 3px 3px 0; }
.c-tasks { display: flex; align-items: center; gap: 8px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.frac { font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.epic-body { padding: 4px 8px 14px 26px; }
.plan-dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 6px 0 4px; font-size: 13px; }
.plan-dl dt { color: var(--muted); }
.plan-dl dd { margin: 0; overflow-wrap: anywhere; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 6px 0; }
.story { margin: 4px 0 8px; }
.story-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-weight: 600; font-size: 13px; }
.story-h .meta { display: inline; }
.sid { color: var(--ink-2); font: 600 12px var(--mono); }
.sst { font-size: 11.5px; font-weight: 400; color: var(--ink-2); }
.sst::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--axis); }
.sst.s-done::before { background: var(--good); }
.sst.s-in-progress::before { background: var(--s1); }
ul.tasks { list-style: none; margin: 4px 0 6px; padding: 0; }
ul.tasks li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 2px 6px; font-size: 13px; border-radius: 4px; }
ul.tasks li.done .ttl { color: var(--ink-2); }
ul.tasks li.next { background: var(--info-bg); }
.cb { flex: none; position: relative; top: 2px; width: 13px; height: 13px; border: 1.5px solid var(--muted); border-radius: 3px; }
.cb.on { background: var(--good); border-color: var(--good); }
.cb.on::after { content: ""; position: absolute; left: 3px; top: 0; width: 3.5px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.tid { background: none; padding: 0; color: var(--ink-2); }
.seed { font: 11.5px var(--mono); color: var(--muted); }
.ttl { flex: 1 1 220px; min-width: 0; }
.when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
li.next .when { color: var(--ink); font-weight: 600; }
dl.details { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 12px 0 0; font-size: 12.5px; }
dl.details div { display: flex; gap: 6px; }
dl.details dt { color: var(--muted); }
dl.details dd { margin: 0; }

/* charts */
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.sw.line { width: 2px; height: 14px; border-radius: 0; background: var(--ink-2); }
.sw.dia { width: 9px; height: 9px; border-radius: 1px; transform: rotate(45deg); background: var(--ink-2); }
svg.chart { display: block; max-width: 100%; height: auto; font: 11.5px var(--sans); }
svg .lbl { fill: var(--ink); }
svg .lbl.sprint { font-weight: 650; }
svg .grp { fill: var(--ink); font-weight: 650; }
svg .axis { fill: var(--muted); font-variant-numeric: tabular-nums; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .base { stroke: var(--axis); stroke-width: 1; }
svg .now { stroke: var(--ink-2); stroke-width: 1.5; }
svg .ref { stroke: var(--ink-2); stroke-width: 1; }
svg .hit { fill: transparent; }
svg .band { fill: var(--surface-2); }
svg g.row:hover .hit, svg g.row:focus .hit { fill: var(--surface-2); }
svg g.row { outline: none; }
svg .in { fill: #fff; font-weight: 600; }
svg .ms-done { fill: var(--good); stroke: var(--surface); stroke-width: 2; }
svg .ms-fc { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
svg .dot-a { stroke: var(--surface); stroke-width: 2; }
.act { fill: var(--act); background: var(--act); }
.fc { fill: var(--fc); background: var(--fc); }
.fc90 { fill: var(--fc90); background: var(--fc90); }
.m1 { fill: var(--s1); background: var(--s1); }
.m2 { fill: var(--s2); background: var(--s2); }
.m3 { fill: var(--s3); background: var(--s3); }
.de { fill: var(--axis); background: var(--axis); }
.headline { font-size: 13.5px; margin: 0 0 12px; color: var(--ink); }
.headline b { font-weight: 650; }
details.tv { margin-top: 10px; font-size: 12.5px; }
details.tv > summary { cursor: pointer; color: var(--ink-2); width: max-content; }
details.tv table { margin-top: 6px; }
td.repo-name { min-width: 15em; }
td.repo-name .meta { overflow-wrap: anywhere; }
td.gate code { overflow-wrap: normal; }
footer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
#tip { position: fixed; z-index: 10; pointer-events: none; max-width: 380px; padding: 7px 10px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.45; white-space: pre-line; box-shadow: 0 4px 14px rgba(0, 0, 0, .22); }
[hidden] { display: none !important; }

@media (max-width: 1060px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ep-cols { display: none; }
  details.epic > summary { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px 12px; }
  .c-title { grid-column: 1 / -1; }
  .c-num { text-align: left; }
  details.epic > summary [data-label]::before { content: attr(data-label); display: block; font-size: 11.5px; color: var(--muted); }
  .c-size, .c-tasks { flex-wrap: wrap; }
  .c-size::before, .c-tasks::before { width: 100%; }
  .epic-body { padding-left: 8px; }
}
@media (max-width: 860px) {
  header.top { grid-template-columns: minmax(0, 1fr) auto; }
  .tabs { grid-column: 1 / -1; grid-row: 2; }
  .live { grid-column: 2; }
  .sp-head { display: none; }
  .ep-cols.indent { margin-left: 0; }
  .sg-body { margin-left: 6px; }
  details.bpg > summary { grid-template-columns: 16px minmax(0, 1fr); }
  details.bpg > summary > .ribbon, details.bpg > summary > .bpg-m { grid-column: 2; justify-self: stretch; }
  .sp { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .sp-name, .sp-plan { grid-column: 1 / -1; }
  .nd { grid-template-columns: minmax(0, 1fr); }
  .nd-cmd { justify-self: start; text-align: left; }
  details.epic > summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) { main { padding: 0 16px 32px; } header.top { position: static; margin: 0 -16px 14px; padding: 10px 16px; } }
@media (max-width: 520px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .c-title::before, .chev::before { transition: none; } }
</style>
</head>
<body>
<main id="main">
  <header class="top"><div id="hdr" class="brand"><h1>Blueprint dashboard</h1></div><nav id="tabs" class="tabs" aria-label="Blueprint" hidden></nav><span id="live" class="live">Connecting…</span></header>
  <div id="fatal" class="banner err" role="alert" hidden></div>
  <div id="banners"></div>
  <section id="needs" class="card" aria-label="Needs you" hidden></section>
  <div id="kpis" class="kpis"></div>
  <section id="sprints" class="card" aria-label="Sprints" hidden></section>
  <section id="sessions" class="card" aria-label="Active sessions" hidden></section>
  <section id="epics" class="card" aria-label="Epics" hidden></section>
  <section id="timeline" class="card" aria-label="Timeline" hidden></section>
  <section id="breakdown" class="card" aria-label="Where the time went" hidden></section>
  <section id="rates" class="card" aria-label="What an acceptance criterion costs" hidden></section>
  <section id="repos" class="card" aria-label="Repositories" hidden></section>
  <section id="discovery" class="card" aria-label="Discovery and amendments" hidden></section>
  <footer id="foot"></footer>
</main>
<div id="tip" role="tooltip" hidden></div>
<!--STATE-->
<script>
(() => {
  'use strict';

  // ---------- small helpers; the state is read defensively everywhere ----------
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const POLL_MS = 3000, STALE_MS = 10000;
  const ACTIVE = ['compiled', 'stale', 'tasked', 'in-progress', 'implemented'];
  const arr = v => (Array.isArray(v) ? v : []);
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
  const isNum = v => typeof v === 'number' && isFinite(v);
  const num = v => (isNum(v) ? v : 0);
  const sum = (list, f) => list.reduce((t, x) => t + num(f(x)), 0);
  const pad2 = n => String(n).padStart(2, '0');
  const base = p => String(p || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop();
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + 's'}`;
  const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : '');
  const clip = (s, n) => (s.length > n ? s.slice(0, Math.max(1, n - 1)) + '…' : s);
  const domId = (prefix, key) => `${prefix}-${String(key).replace(/[^A-Za-z0-9_-]/g, '_')}`;
  const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);

  // ---------- HTML: every interpolated value is escaped unless it is already markup (Raw) ----------
  class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
  const part = v => (v == null || v === false ? '' : v instanceof Raw ? v.s : Array.isArray(v) ? v.map(part).join('') : esc(v));
  const html = (strings, ...vals) => new Raw(strings.reduce((out, s, i) => out + part(vals[i - 1]) + s));
  const join = (list, sep) => new Raw(list.map(part).filter(Boolean).join(esc(sep)));
  const OPEN = new Raw(' open');

  // ---------- units, formatted in one place (the same rules as units.py) ----------
  function dur(seconds, calendar) {
    if (!isNum(seconds)) return '—';
    const s = Math.max(0, Math.round(seconds));
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (d) return h ? `${d}d ${h}h` : `${d}d`;
    if (h) return m ? `${h}h ${m}m` : `${h}h`;
    if (m) return calendar || !sec || m >= 10 ? `${m}m` : `${m}m ${sec}s`;
    return `${sec}s`;
  }
  const cal = s => dur(s, true);
  const money = (usd, estimated) => (isNum(usd)
    ? '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (estimated ? '+' : '') : '—');
  // work recorded without a cost (Claude Code writes it when a session ends) costs "unknown", never $0.00
  const costOf = (usd, estimated, sessions) => (isNum(usd) ? money(usd, estimated) : num(sessions) ? 'unknown' : '—');
  const tok = n => (!isNum(n) ? '—' : n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n)));
  function range(pair, f) {
    const p = arr(pair), lo = isNum(p[0]) ? p[0] : p[1], hi = isNum(p[1]) ? p[1] : p[0];
    if (!isNum(lo)) return '—';
    const a = f(lo), b = f(hi);
    return a === b ? a : `${a} – ${b}`;
  }
  // estimates in a row are ranges people read at a glance: whole hours and whole dollars; the exact range is in the tooltip
  const roughDur = s => (s >= 86400 ? dur(s, true) : s >= 3600 ? `${Math.round(s / 3600)}h` : `${Math.max(1, Math.round(s / 60))}m`);
  const roughMoney = v => '$' + Math.round(v).toLocaleString('en-US');
  function rough(pair, f) {
    const p = arr(pair), lo = isNum(p[0]) ? p[0] : p[1], hi = isNum(p[1]) ? p[1] : p[0];
    if (!isNum(lo)) return '';
    const a = f(lo), b = f(hi);
    return a === b ? a : `${a}–${b}`;
  }
  // ISO timestamps (any offset, "Z", microseconds) to epoch ms; a bare date is local midnight.
  const ISO = /^(\d{4})-(\d\d)-(\d\d)(?:[T ](\d\d):(\d\d)(?::(\d\d)(?:[.,](\d+))?)?\s*(Z|[+-]\d\d:?\d\d)?)?$/i;
  function ts(v) {
    if (isNum(v)) return v < 1e11 ? v * 1000 : v;
    const m = ISO.exec(String(v == null ? '' : v).trim());
    if (!m) return null;
    const y = +m[1], mo = +m[2] - 1, d = +m[3];
    if (m[4] === undefined) return new Date(y, mo, d).getTime();
    const f = [y, mo, d, +m[4], +m[5], +(m[6] || 0), m[7] ? Math.round(+('0.' + m[7]) * 1000) : 0];
    if (!m[8]) return new Date(...f).getTime();
    const z = m[8].toUpperCase() === 'Z' ? 0 : (m[8][0] === '-' ? -1 : 1) * (+m[8].slice(1, 3) * 60 + +m[8].slice(-2));
    return Date.UTC(...f) - z * 60000;
  }
  const fdate = t => { const d = new Date(t); return `${MONTHS[d.getMonth()]} ${d.getDate()}${d.getFullYear() !== new Date(ctx.now).getFullYear() ? ', ' + d.getFullYear() : ''}`; };
  const ftime = t => { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const fstamp = t => (new Date(t).toDateString() === new Date(ctx.now).toDateString() ? ftime(t) : `${fdate(t)} ${ftime(t)}`);

  // ---------- page state ----------
  const SNAPSHOT = typeof window.__STATE__ !== 'undefined';
  const ui = { bp: 'all', open: new Set(), auto: new Set(), groups: new Map(), state: null, error: null, lastOk: 0 };
  const ctx = { now: Date.now(), multi: false, index: new Map(), sprints: new Map() };
  const fromHash = /(?:^#|&)bp=([^&]*)/.exec(location.hash || '');
  if (fromHash) { try { ui.bp = decodeURIComponent(fromHash[1]) || 'all'; } catch (_) { ui.bp = 'all'; } }

  const blueprints = st => arr(st.blueprints).filter(b => b && typeof b === 'object');
  const selected = st => (ui.bp === 'all' ? blueprints(st) : blueprints(st).filter(b => b.id === ui.bp));
  const epicsOf = b => arr(b.epics).filter(e => e && typeof e === 'object');
  const keyOf = (b, e) => String(e.key || `${b.id}:${e.id}`);
  const bpName = b => String(b.product || b.id || 'Blueprint');
  const bpShort = b => String(b.prefix || b.id || 'Blueprint');
  const inBp = key => ui.bp === 'all' || String(key || '').startsWith(ui.bp + ':');
  function epicRef(key) { // "E01", or "desk:E01" when the project has several blueprints
    const hit = ctx.index.get(key);
    if (hit) return ctx.multi ? `${hit.b.id}:${hit.e.id}` : String(hit.e.id);
    return ctx.multi ? String(key || '') : String(key || '').replace(/^[^:]*:/, '');
  }
  const refOf = (b, e) => (ctx.multi ? `${b.id}:${e.id}` : String(e.id));
  const isWorking = e => ACTIVE.includes(e.state) || (e.elsewhere && typeof e.elsewhere === 'object') || (e.started && typeof e.started === 'object');

  // The epics in delivery order (the plan's order, which puts an epic after the open ones it depends on)
  function ordered(b) {
    const eps = epicsOf(b), order = arr(obj(b.plan).order).map(String);
    if (!order.length) return eps;
    const byId = new Map(eps.map(e => [String(e.id), e]));
    return order.map(id => byId.get(id)).filter(Boolean).concat(eps.filter(e => !order.includes(String(e.id))));
  }

  // ---------- sprints, from the delivery plan's sprints table (§16.2) ----------
  const sprintName = s => (s.label === null ? 'Not in a sprint' : /^\d+$/.test(s.label) ? `Sprint ${s.label}` : s.label);
  const sprintId = s => (s.label === null ? '—' : /^\d+$/.test(s.label) ? `S${s.label}` : s.label);

  function makeSprint(b, label, milestone, exit, epics, early, est) {
    const acts = epics.map(e => obj(e.actual));
    const firsts = acts.map(a => ts(a.first)).filter(isNum), lasts = acts.map(a => ts(a.last)).filter(isNum);
    const worked = acts.filter(a => num(a.sessions) > 0), priced = worked.filter(a => isNum(a.cost_usd));
    const done = epics.filter(e => e.state === 'done');
    return {
      b, label, milestone, exit, epics, early, est: est && typeof est === 'object' ? est : null,
      acs: sum(epics, e => e.acs), acsDone: sum(done, e => e.acs), n: epics.length, nDone: done.length,
      done: epics.length > 0 && done.length === epics.length,
      started: done.length > 0 || epics.some(e => isWorking(e) || num(obj(e.actual).sessions) > 0),
      first: firsts.length ? Math.min(...firsts) : null, last: lasts.length ? Math.max(...lasts) : null,
      agent: sum(acts, a => a.agent_s), wait: sum(acts, a => a.wait_s),
      cost: priced.length ? sum(priced, a => a.cost_usd) : null,
      costEstimated: priced.length > 0 && (priced.length < worked.length || priced.some(a => a.cost_estimated)),
    };
  }

  function sprintsOf(b) { // [] when the blueprint has no sprints table
    if (ctx.sprints.has(b)) return ctx.sprints.get(b);
    const plan = obj(b.plan), est = obj(plan.sprint_estimates), eps = epicsOf(b);
    const byId = new Map(eps.map(e => [String(e.id), e]));
    const out = [];
    for (const s of arr(plan.sprints).filter(x => x && typeof x === 'object')) {
      const label = String(s.label == null ? '' : s.label), ids = arr(s.epics).map(String), notes = obj(s.notes);
      const mine = ids.filter(id => byId.has(id) && String(byId.get(id).sprint) === label).map(id => byId.get(id));
      const early = ids.filter(id => byId.has(id) && String(byId.get(id).sprint) !== label).map(id => ({ e: byId.get(id), note: String(notes[id] || '') }));
      out.push(makeSprint(b, label, String(s.milestone || ''), String(s.exit || ''), mine, early, est[label]));
    }
    if (out.length) {
      const loose = eps.filter(e => !e.sprint);
      if (loose.length) out.push(makeSprint(b, null, 'Not in a sprint', 'The sprints table of the delivery plan does not list these epics.', loose, [], null));
      let current = null;
      for (const s of out) {
        s.status = s.done ? 'done' : !current && s.label !== null ? 'current' : s.started ? 'started' : 'planned';
        if (s.status === 'current') current = s;
      }
    }
    ctx.sprints.set(b, out);
    return out;
  }
  const currentSprint = b => sprintsOf(b).find(s => s.status === 'current') || null;
  const numbered = b => sprintsOf(b).filter(s => s.label !== null && /^\d+$/.test(s.label));

  function prepare(st) {
    ctx.now = SNAPSHOT ? ts(st.generated) || Date.now() : Date.now();
    ctx.multi = blueprints(st).length > 1;
    ctx.index = new Map();
    ctx.sprints = new Map();
    ctx.unlocks = new Map(); // epic key → the epics that wait for it
    for (const b of blueprints(st)) for (const e of epicsOf(b)) {
      ctx.index.set(keyOf(b, e), { b, e });
      for (const dep of arr(e.blocked_by)) {
        const k = String(dep).includes(':') ? String(dep) : `${b.id}:${dep}`;
        if (!ctx.unlocks.has(k)) ctx.unlocks.set(k, []);
        ctx.unlocks.get(k).push(e);
      }
    }
    if (ui.bp !== 'all' && !blueprints(st).some(b => b.id === ui.bp)) ui.bp = 'all';
    // the epic being built starts expanded, once, where one blueprint is shown (several would bury the page in tasks)
    if (ui.bp !== 'all' || !ctx.multi) for (const [key, { b, e }] of ctx.index) {
      if (inBp(key) && b && (e.state === 'in-progress' || e.state === 'implemented') && !ui.auto.has(key)) { ui.auto.add(key); ui.open.add(key); }
    }
  }

  // ---------- header, tabs, banners ----------
  function header(st) {
    const list = blueprints(st), one = list.length === 1 ? list[0] : null;
    return html`<h1>${st.project || 'Project'}</h1><span class="sub">${one && one.product ? `${one.product} · ` : ''}blueprint dashboard</span>`;
  }

  function tabs(st) {
    const list = blueprints(st);
    if (list.length < 2) return '';
    const acs = l => sum(l, b => (isNum(b.acs_total) ? b.acs_total : sum(epicsOf(b), e => e.acs)));
    const done = l => sum(l, b => (isNum(b.acs_done) ? b.acs_done : sum(epicsOf(b).filter(e => e.state === 'done'), e => e.acs)));
    const tab = (id, label, l, title) => html`<button type="button" class="tab" role="tab" id="${domId('tab', id)}" data-bp="${id}" aria-selected="${ui.bp === id ? 'true' : 'false'}" title="${title}">${label}<span class="pct">${pct(done(l), acs(l))}%</span></button>`;
    return [tab('all', 'All', list, 'Every blueprint'), ...list.map(b => tab(b.id, bpShort(b), [b], bpName(b)))];
  }

  function banners(st) {
    const out = [];
    if (ui.error) {
      out.push(html`<div class="banner err" role="alert"><strong>${st ? 'Could not refresh.' : 'Could not load the dashboard state.'}</strong> ${ui.error}${st && ui.lastOk ? html` <span class="muted">Showing the last good state, from ${ftime(ui.lastOk)}.</span>` : ''}</div>`);
    }
    if (!st) return out.length || SNAPSHOT ? out : html`<p class="empty">Loading the dashboard state…</p>`;
    if (st.metrics === 'off') out.push(html`<div class="banner info"><strong>Metrics are off.</strong> Time, cost and forecasts need <code>metrics: local</code> (or <code>commit</code>) in the config.</div>`);
    return out;
  }

  // ---------- needs you: what waits on a person, most urgent first ----------
  function nextCommand(b, n) {
    const cmd = String(n.command || '');
    if (cmd === 'bootstrap' || cmd === 'migrate') return `blueprint.py ${cmd}${ctx.multi ? ` --blueprint ${b.id}` : ''}`;
    if (cmd === 'speckit-blueprint-compile' && n.epic) return `/${cmd} ${ctx.multi ? `${b.id}:` : ''}${n.epic}`;
    return `/${cmd}`;
  }

  function needs(st) {
    const items = [], sel = selected(st);
    // sessions that wait for an answer, one line per epic
    const waiting = arr(st.sessions).filter(s => s && s.kind === 'waiting' && inBp(s.epic));
    const byEpic = new Map();
    for (const s of waiting) { const k = String(s.epic || s.feature || '?'); if (!byEpic.has(k)) byEpic.set(k, []); byEpic.get(k).push(s); }
    for (const [k, list] of byEpic) {
      const hit = ctx.index.get(k), longest = Math.max(...list.map(s => num(s.for_s)));
      const what = hit ? `${epicRef(k)} ${hit.e.title || ''}` : base(k);
      const done = hit && hit.e.state === 'done';
      items.push({ tone: 'wait', tag: `Waiting · ${dur(longest)}`, title: list.length > 1 ? `${list.length} sessions on ${what} wait for your answer` : `A session on ${what} waits for your answer`,
        detail: done ? 'The epic is done: close these sessions when nothing is left in them.' : `In ${[...new Set(list.map(s => base(s.worktree)))].join(', ')}.`, cmd: '' });
    }
    for (const b of sel) {
      for (const why of arr(b.migration_needed)) items.push({ tone: 'fix', tag: 'Migrate', title: `${ctx.multi ? `${bpName(b)}: ` : ''}${why}`, detail: '', cmd: 'blueprint.py migrate' });
      const n = obj(b.next), cmd = String(n.command || '');
      if (cmd && cmd !== 'wait') {
        const fix = cmd === 'bootstrap' || cmd === 'migrate';
        const hit = n.epic ? epicsOf(b).find(e => e.id === n.epic) : null;
        const unlocks = hit ? arr(ctx.unlocks.get(keyOf(b, hit))).length : 0;
        items.push({ tone: fix ? 'fix' : 'next', tag: fix ? 'Fix first' : 'Next', cmd: nextCommand(b, n),
          title: hit ? `${refOf(b, hit)} ${hit.title || ''}` : `${ctx.multi ? `${bpName(b)}: ` : ''}${fix ? `run ${cmd}` : cap(cmd)}`,
          detail: `${n.why || ''}${unlocks && !/wait/.test(String(n.why || '')) ? ` It unlocks ${plural(unlocks, 'epic')}.` : ''}${n.effort ? ` Runs at effort ${n.effort}.` : ''}` });
      } else if (cmd === 'wait') {
        items.push({ tone: 'check', tag: 'Waiting', title: `${ctx.multi ? `${bpName(b)}: ` : ''}nothing can start here`, detail: n.why || '', cmd: '' });
      }
      const nextEpic = n.epic || null;
      for (const e of epicsOf(b)) {
        if (e.state === 'implemented' && e.id !== nextEpic) items.push({ tone: 'next', tag: 'Review', title: `${refOf(b, e)} ${e.title || ''}`, detail: arr(e.review_missing).length ? `The review has no evidence for ${e.review_missing.slice(0, 4).join(', ')}.` : 'Every task is checked.', cmd: '/speckit-blueprint-review' });
        if (e.state === 'stale' && e.id !== nextEpic) items.push({ tone: 'fix', tag: 'Recompile', title: `${refOf(b, e)} ${e.title || ''}`, detail: `The blueprint changed after it was compiled${num(obj(e.actual).sessions) ? `; ${dur(obj(e.actual).agent_s)} of work is recorded on it` : ''}.`, cmd: `/speckit-blueprint-compile ${ctx.multi ? `${b.id}:` : ''}${e.id}` });
      }
      // epics nothing blocks, beside the next one: candidates for a second worktree
      const planned = sprintsOf(b).length > 0;
      const ready = ordered(b).filter(e => e.state === 'not-compiled' && !arr(e.blocked_by).length && !e.elsewhere && !e.started && e.id !== nextEpic && (!planned || e.sprint));
      if (ready.length) {
        items.push({ tone: 'ready', tag: 'Also ready', title: `${ready.slice(0, 4).map(e => `${refOf(b, e)} ${e.title || ''}`).join(' · ')}${ready.length > 4 ? ` and ${ready.length - 4} more` : ''}`,
          detail: 'Nothing blocks these; each can be built in its own worktree beside the next epic.', cmd: `blueprint.py workspace ${ctx.multi ? `${b.id}:` : ''}${ready[0].id} --create` });
      }
      const outside = planned ? epicsOf(b).filter(e => !e.sprint && e.state !== 'done') : [];
      if (outside.length) {
        items.push({ tone: 'check', tag: 'Check', title: outside.map(e => `${refOf(b, e)} ${e.title || ''}`).join(' · '),
          detail: `In no sprint of the delivery plan, yet counted as remaining work (${plural(sum(outside, e => e.acs), 'AC')}).`, cmd: '' });
      }
    }
    if (!items.length) return '';
    const order = { wait: 0, fix: 1, next: 2, ready: 3, check: 4 };
    items.sort((a, b) => order[a.tone] - order[b.tone]);
    const urgent = items.filter(i => i.tone === 'wait' || i.tone === 'fix').length;
    return html`<div class="card-h"><h2>Needs you</h2>${urgent ? html`<span class="count">${urgent}</span>` : ''}<span class="lede">Answers, fixes and the next commands, most urgent first</span></div>
      <ul class="needs">${items.map(i => html`<li class="nd t-${i.tone}"><span class="nd-tag"><i></i>${i.tag}</span><div class="nd-main"><strong>${i.title}</strong>${i.detail ? html`<span class="meta">${i.detail}</span>` : ''}</div><div class="nd-cmd">${i.cmd ? html`<code>${i.cmd}</code>` : ''}</div></li>`)}</ul>`;
  }

  // ---------- the four figures ----------
  function mergeRemaining(list) {
    const add = k => [0, 1].map(i => sum(list, r => arr(r[k])[i]));
    const latest = i => list.map(r => arr(r.finish)[i]).filter(Boolean).sort().pop();
    return {
      agent_s: add('agent_s'), cost_usd: list.some(r => isNum(arr(r.cost_usd)[0])) ? add('cost_usd') : null,
      tokens: add('tokens'), epics: sum(list, r => r.epics),
      calendar_s: [0, 1].map(i => Math.max(0, ...list.map(r => num(arr(r.calendar_s)[i])))),
      finish: [latest(0), latest(1)], parallelism: Math.max(1, ...list.map(r => num(r.parallelism))),
    };
  }

  const card = (label, value, subs) => html`<div class="kpi"><div class="lbl">${label}</div><div class="val">${value}</div>${subs.filter(Boolean).map(s => html`<div class="sub">${s}</div>`)}</div>`;

  function kpis(st) {
    const sel = selected(st), built = sel.filter(b => b.state !== 'no-blueprint');
    const epics = sel.flatMap(epicsOf), acts = epics.map(e => obj(e.actual));
    const acs = sum(sel, b => (isNum(b.acs_total) ? b.acs_total : sum(epicsOf(b), e => e.acs)));
    const acsDone = sum(sel, b => (isNum(b.acs_done) ? b.acs_done : sum(epicsOf(b).filter(e => e.state === 'done'), e => e.acs)));
    const p = pct(acsDone, acs);
    const firsts = acts.map(a => ts(a.first)).filter(isNum);
    const cur = sel.length === 1 ? currentSprint(sel[0]) : null, nums = sel.length === 1 ? numbered(sel[0]) : [];
    const where = cur ? `Now in ${sprintName(cur)}${nums.length && cur.label !== null && /^\d+$/.test(cur.label) ? ` of ${nums.length}` : ''} · ${cur.milestone}`
      : sel.length > 1 ? join(sel.map(b => { const c = currentSprint(b); return c ? `${bpShort(b)} ${sprintId(c)}` : ''; }), ' · ') : '';
    const progress = card('Progress', `${p}%`, [
      html`<span class="meter" role="img" aria-label="${p}% of acceptance criteria done"><i style="width:${p}%"></i></span>`,
      `${acsDone} of ${acs} ACs · ${epics.filter(e => e.state === 'done').length} of ${plural(epics.length, 'epic')}`,
      where && where.s !== '' ? (sel.length > 1 ? html`Sprints now: ${where}` : where) : '',
      firsts.length ? `Started ${fdate(Math.min(...firsts))}` : '',
    ]);
    const off = st.metrics === 'off';
    const disc = sel.flatMap(b => Object.values(obj(b.discovery)).map(obj));
    const worked = acts.concat(disc).filter(a => num(a.sessions) > 0), priced = worked.filter(a => isNum(a.cost_usd));
    const estimated = priced.length > 0 && (priced.length < worked.length || priced.some(a => a.cost_estimated));
    const spentCost = priced.length ? money(sum(priced, a => a.cost_usd), estimated) : worked.length ? 'Cost unknown' : '—';
    const agent = sum(acts, a => a.agent_s) + sum(disc, d => d.agent_s), waited = sum(acts, a => a.wait_s) + sum(disc, d => d.wait_s);
    const spent = off ? card('Spent', '—', ['Metrics are off']) : !worked.length ? card('Spent', '—', ['No recorded sessions yet']) : card('Spent', spentCost, [
      `${dur(agent)} agent time · ${tok(sum(acts, a => a.tokens) + sum(disc, d => d.tokens))} tokens`,
      waited > 0 ? `Sessions waited ${cal(waited)} for you` : '',
      estimated ? 'Part of it is estimated or not recorded yet' : worked.length && !priced.length ? 'Claude Code records a session’s cost when the session ends' : '',
    ]);
    const rems = built.map(b => b.remaining).filter(r => r && typeof r === 'object');
    const rem = rems.length > 1 ? mergeRemaining(rems) : rems[0] || null;
    const need = off ? 'Metrics are off' : !built.length ? 'No blueprint yet' : 'Needs one finished epic with recorded sessions';
    if (!rem || !num(rem.epics)) {
      const allDone = rem && built.length && built.every(b => b.state === 'all-done' || epicsOf(b).every(e => e.state === 'done'));
      return [progress, spent, card('Remaining P50 – P90', allDone ? 'Nothing left' : '—', [allDone ? 'Every epic is done' : need]),
        card('Forecast finish', allDone ? 'Done' : '—', [allDone ? '' : need])];
    }
    const conf = String((built.find(b => b.confidence) || {}).confidence || 'none');
    const hist = Math.max(0, ...built.map(b => num(b.history)));
    const k = Math.max(1, Math.round(num(rem.parallelism)));
    return [progress, spent,
      isNum(arr(rem.cost_usd)[0])
        ? card('Remaining P50 – P90', html`<span title="${range(rem.cost_usd, money)}">${range(rem.cost_usd, roughMoney)}</span>`, [`${range(rem.agent_s, dur)} agent time`, `${cap(conf)} confidence · from ${plural(hist, 'finished epic')}`])
        : card('Remaining P50 – P90', range(rem.agent_s, dur), ['Agent time · cost unknown: no finished epic has a recorded cost', `${cap(conf)} confidence · from ${plural(hist, 'finished epic')}`]),
      card('Forecast finish', range(arr(rem.finish).map(ts), fdate), [`${plural(num(rem.epics), 'epic')} left · ${plural(k, 'epic')} at a time${rems.length > 1 ? ' per blueprint' : ''}`,
        isNum(arr(rem.calendar_s)[0]) ? `${range(rem.calendar_s, cal)} of calendar time` : '']),
    ];
  }

  // ---------- state of an epic: [class, label, note] ----------
  function stateOf(e) {
    const s = e.state, w = obj(e.elsewhere);
    if (s === 'done') {
      const open = num(e.tasks_total) - num(e.tasks_done);
      return ['done', 'Done', open > 0 ? `${plural(open, 'task')} unchecked` : ''];
    }
    if (e.elsewhere && typeof e.elsewhere === 'object') return ['elsewhere', 'Building', `in ${base(w.worktree) || 'another worktree'}`];
    const sv = obj(e.started);
    if (e.started && typeof e.started === 'object') return sv.merged_into
      ? ['elsewhere', 'Merged', `in ${sv.merged_into}; bring it in`]
      : sv.local ? ['elsewhere', 'On a branch', `${sv.branch || ''}`] : ['elsewhere', 'Pushed', `on ${sv.remote || 'a remote branch'}`];
    if (s === 'in-progress') return ['building', 'Building', ''];
    if (s === 'implemented') return ['review', 'Review', arr(e.review_missing).length ? 'evidence missing' : 'every task checked'];
    if (s === 'stale') return ['stale', 'Stale', 'recompile'];
    if (arr(e.blocked_by).length) return ['blocked', 'Blocked', ''];
    return ['ready', 'Ready', s === 'tasked' ? 'tasks written' : s === 'compiled' ? 'compiled' : ''];
  }
  const STATES = [['done', 'Done'], ['building', 'Building'], ['review', 'Review'], ['ready', 'Ready'], ['blocked', 'Blocked'], ['stale', 'Stale']];

  function epicTip(b, e) {
    const [, label, note] = stateOf(e), est = obj(e.estimate), a = obj(e.actual);
    const lines = [`${refOf(b, e)} ${e.title || ''}`, `${label}${note ? ` (${note})` : ''} · ${plural(num(e.acs), 'AC')} · ${plural(arr(e.stories).length, 'story', 'stories')}${e.size ? ` · size ${e.size}` : ''}`];
    if (num(e.tasks_total)) lines.push(`Tasks ${num(e.tasks_done)}/${e.tasks_total}`);
    if (num(a.agent_s)) lines.push(`Worked ${dur(a.agent_s)} · ${costOf(a.cost_usd, a.cost_estimated, a.sessions)}`);
    if (e.state !== 'done' && isNum(arr(est.agent_s)[0])) lines.push(`Estimate ${range(est.agent_s, dur)}${isNum(arr(est.cost_usd)[0]) ? ` · ${range(est.cost_usd, money)}` : ''}`);
    if (arr(e.blocked_by).length && e.state !== 'done') lines.push(`Waits for ${e.blocked_by.join(', ')}`);
    if (e.critical) lines.push('On the critical path');
    return lines.join('\n');
  }

  // ---------- sprints ----------
  function blockW(e, max) { return Math.max(0.6, (100 * num(e.acs)) / Math.max(1, max)); }

  function segbar(b, s, max, trackW) {
    const label = `${sprintName(s)}: ${s.epics.map(e => `${e.id} ${stateOf(e)[1]}, ${plural(num(e.acs), 'AC')}`).join('; ')}`;
    return html`<div class="segbar" role="img" aria-label="${label}">${s.epics.map(e => {
      const w = blockW(e, max), cls = stateOf(e)[0], fits = (w / 100) * trackW >= 34;
      return html`<span class="blk st-${cls}" style="flex-basis:${w.toFixed(2)}%" data-tip="${epicTip(b, e)}">${fits ? e.id : ''}</span>`;
    })}</div>`;
  }

  function sprintRow(b, s, max, trackW) {
    const status = s.status === 'done' ? html`<span class="pill p-done">Done</span>` : s.status === 'current' ? html`<span class="pill p-current">Current</span>`
      : s.status === 'started' ? html`<span class="pill">Started</span>` : '';
    const early = s.early.map(x => `${x.e.id} starts here${x.note ? ` (${x.note})` : ''}`);
    const est = s.est;
    let when, whenSub;
    if (s.done) { when = s.last ? html`Done <b>${fdate(s.last)}</b>` : 'Done'; whenSub = s.cost !== null ? `${money(s.cost, s.costEstimated)} · ${dur(s.agent)}` : s.agent ? dur(s.agent) : ''; }
    else if (est && arr(est.finish).length) {
      when = html`<b>${range(arr(est.finish).map(ts), fdate)}</b>`;
      whenSub = isNum(arr(est.cost_usd)[0]) ? `est. ${rough(est.cost_usd, roughMoney)} more` : isNum(arr(est.agent_s)[0]) ? `est. ${rough(est.agent_s, roughDur)} more` : '';
    } else { when = html`<span class="muted">No forecast</span>`; whenSub = ''; }
    const tip = [`${sprintName(s)} · ${s.milestone}`, s.exit ? `Exit criteria: ${s.exit}` : '', s.cost !== null ? `Spent ${money(s.cost, s.costEstimated)} · ${dur(s.agent)} agent time` : '',
      s.first ? `Worked ${fstamp(s.first)} – ${fstamp(s.last)}` : ''].filter(Boolean).join('\n');
    return html`<div class="sp s-${s.status}">
      <div class="sp-name" data-tip="${tip}"><div class="sp-top"><span class="sp-id">${sprintId(s)}</span>${status}</div><span class="sp-ms">${s.milestone || sprintName(s)}</span></div>
      <div class="sp-plan">${s.epics.length ? segbar(b, s, max, trackW) : html`<span class="muted">No epics</span>`}${!s.done && (s.exit || early.length) ? html`<div class="sp-exit">${s.exit ? html`<b>Exit</b> ${s.exit}` : ''}${early.length ? html`${s.exit ? ' · ' : ''}${early.join(' · ')}` : ''}</div>` : ''}</div>
      <div class="sp-fig"><b>${s.acsDone}</b> / ${s.acs} ACs<span class="meta">${s.nDone} of ${plural(s.n, 'epic')} done</span></div>
      <div class="sp-when">${when}${whenSub ? html`<span class="meta">${whenSub}</span>` : ''}</div>
    </div>`;
  }

  // Several blueprints on one page: each is a folded group whose summary shows its sprints as a ribbon
  const wrapped = () => ctx.multi && ui.bp === 'all';
  const groupOpen = (key, fallback) => (ui.groups.has(key) ? ui.groups.get(key) : fallback);

  function ribbon(b) {
    const list = sprintsOf(b).filter(s => s.acs > 0);
    if (!list.length) return '';
    return html`<span class="ribbon" role="img" aria-label="${list.map(s => `${sprintId(s)} ${s.acsDone} of ${s.acs} ACs`).join(', ')}">${list.map(s =>
      html`<span class="rb${s.status === 'current' ? ' rb-cur' : ''}" style="flex-grow:${s.acs}" data-tip="${sprintName(s)} · ${s.milestone}\n${s.acsDone} of ${s.acs} ACs done${s.status === 'current' ? ' · current' : ''}"><i style="width:${pct(s.acsDone, s.acs)}%"></i></span>`)}</span>`;
  }

  function bpSummary(b, extra) { // chevron · name over its status · sprint ribbon · progress and finish: the same columns on every row
    const eps = epicsOf(b), acs = sum(eps, e => e.acs), acsDone = sum(eps.filter(e => e.state === 'done'), e => e.acs);
    const list = sprintsOf(b), cur = currentSprint(b), fin = arr(obj(b.remaining).finish).filter(Boolean);
    const status = [list.length
      ? `${list.filter(s => s.done).length} of ${plural(list.filter(s => s.label !== null).length, 'sprint')} done${cur ? ` · now ${sprintId(cur)} ${cur.milestone}` : ''}`
      : `${eps.filter(e => e.state === 'done').length} of ${plural(eps.length, 'epic')} done`, extra || ''].filter(Boolean).join(' · ');
    return html`<span class="chev" aria-hidden="true"></span><span class="bpg-name"><span class="bpg-t">${bpName(b)}</span><span class="bpg-s">${status}</span></span>${ribbon(b) || html`<span></span>`}<span class="bpg-m"><b>${pct(acsDone, acs)}%</b>${fin.length ? ` · finish ${range(fin.map(ts), fdate)}` : ''}</span>`;
  }

  function doneFold(b, done, max, trackW) {
    const key = `spd:${b.id}`, all = sprintsOf(b);
    const idx = done.map(s => all.indexOf(s)), runs = idx.every((v, i) => !i || v === idx[i - 1] + 1);
    const ids = done.map(sprintId), label = runs && ids.length > 2 ? `${ids[0]}–${ids[ids.length - 1]}` : ids.join(', ');
    const priced = done.filter(s => s.cost !== null), firsts = done.map(s => s.first).filter(isNum), lasts = done.map(s => s.last).filter(isNum);
    const meta = [`${sum(done, s => s.acs)} ACs`, priced.length ? money(sum(priced, s => s.cost), priced.some(s => s.costEstimated)) : '',
      firsts.length ? `${fdate(Math.min(...firsts))} – ${fdate(Math.max(...lasts))}` : ''].filter(Boolean).join(' · ');
    return html`<details class="sp-fold" data-group="${key}"${groupOpen(key, false) ? OPEN : ''}><summary class="flat" id="${domId('spd', key)}"><span class="chev" aria-hidden="true"></span><span class="fold-t"><span class="pill p-done">Done</span>${label} · ${plural(done.length, 'sprint')} finished</span><span class="fold-m">${meta}</span></summary>${done.map(s => sprintRow(b, s, max, trackW))}</details>`;
  }

  function sprints(st) {
    const sel = selected(st).filter(b => sprintsOf(b).length);
    if (!sel.length) return '';
    const max = Math.max(1, ...sel.flatMap(b => sprintsOf(b).map(s => s.acs)));
    const trackW = window.innerWidth <= 860 ? chartWidth() : Math.max(160, chartWidth() - 236 - 112 - 156 - 54); // stacked rows give the bar the whole width
    const legend = html`<div class="legend">${STATES.map(([c, l]) => html`<span class="lg st-${c}"><i></i>${l}</span>`)}</div>`;
    const body = b => {
      const list = sprintsOf(b), done = list.filter(s => s.done), open = list.filter(s => !s.done);
      return html`<div class="sp-head" aria-hidden="true"><span>Sprint · milestone</span><span>Epics, sized by acceptance criteria</span><span>Done</span><span>Finish (P50 – P90)</span></div>
        ${done.length ? doneFold(b, done, max, trackW) : ''}${open.map(s => sprintRow(b, s, max, trackW))}${open.length ? '' : html`<p class="empty">Every sprint is done.</p>`}`;
    };
    const group = b => {
      if (!wrapped()) return html`<div class="sp-group">${body(b)}</div>`;
      const key = `spb:${b.id}`;
      return html`<details class="bpg" data-group="${key}"${groupOpen(key, false) ? OPEN : ''}><summary class="flat" id="${domId('bpg', key)}">${bpSummary(b)}</summary><div class="bpg-body">${body(b)}</div></details>`;
    };
    return html`<div class="card-h"><h2>Sprints</h2><span class="lede">${wrapped() ? 'One row per blueprint; open one to see its sprints' : 'From the delivery plan; each block is an epic, as wide as its acceptance criteria'}</span></div>
      <div style="margin:0 0 10px">${legend}</div>${sel.map(group)}`;
  }

  // ---------- live sessions ----------
  function activity(s) {
    const t = isNum(s.for_s) ? ` · ${dur(s.for_s)}` : '';
    if (s.kind === 'waiting') return `Waiting for you${t}`;
    if (s.kind === 'thinking') return `Thinking${t}`;
    if (s.kind !== 'tool') return html`<span class="muted">Starting</span>`;
    const tool = String(s.tool || 'a tool'), d = String(s.detail || ''), file = base(d) || 'a file';
    let what;
    if (tool === 'Bash') what = d ? html`Running <code title="${d}">${d.replace(/^(\s*cd\s+[^;&|]+?\s*&&\s*)+/, '') || d}</code>` : 'Running a command';
    else if (/^(Edit|MultiEdit|NotebookEdit)$/.test(tool)) what = `Editing ${file}`;
    else if (tool === 'Write') what = `Writing ${file}`;
    else if (tool === 'Read') what = `Reading ${file}`;
    else if (tool === 'Grep' || tool === 'Glob') what = d ? html`Searching <code>${d}</code>` : 'Searching';
    else if (tool === 'Agent' || tool === 'Task') what = `Running a subagent${d ? `: ${d}` : ''}`;
    else what = d ? html`${tool} <span class="muted">${d}</span>` : `Using ${tool}`;
    return html`${what}${t}`;
  }

  function sessions(st) {
    const rows = arr(st.sessions).filter(s => s && typeof s === 'object' && inBp(s.epic));
    if (!rows.length) return '';
    const row = s => {
      const waiting = s.kind === 'waiting', hit = ctx.index.get(s.epic);
      const epic = s.epic ? html`<strong>${epicRef(s.epic)}</strong>${hit && hit.e.title ? html` <span class="muted">${hit.e.title}</span>` : ''}${s.story ? html` <span class="muted">· ${s.story}</span>` : ''}` : html`<span class="muted">${s.feature ? base(s.feature) : 'No epic'}</span>`;
      return html`<tr><td class="nowrap"><span class="dot ${waiting ? 'waiting' : 'working'}"></span>${waiting ? 'Waiting' : 'Working'}</td><td>${epic}</td>
        <td title="${s.worktree || ''}">${base(s.worktree) || '—'}</td><td>${activity(s)}</td><td>${s.model || '—'}${s.effort ? html` <span class="muted">· ${s.effort}</span>` : ''}</td></tr>`;
    };
    return html`<div class="card-h"><h2>Active sessions</h2><span class="count">${rows.length}</span><span class="lede">Live while their transcript keeps being written (the last 15 minutes)</span></div>
      <div class="scroll"><table><thead><tr><th>Status</th><th>Epic</th><th>Worktree</th><th>Activity</th><th>Model · effort</th></tr></thead><tbody>${rows.map(row)}</tbody></table></div>`;
  }

  // ---------- epics, grouped by sprint ----------
  function nextStep(b, n) {
    n = obj(n);
    if (!n.command) return '';
    const cmd = String(n.command);
    if (cmd === 'wait') return html`<span class="next">Waiting: ${n.why || 'every remaining epic is blocked or in progress elsewhere.'}</span>`;
    return html`<span class="next">Next: <code title="${n.run || ''}">${nextCommand(b, n)}</code></span>`;
  }

  const sprintKey = (b, s) => `sg:${b.id}:${s.label === null ? '-' : s.label}`;

  function epicsSection(st) {
    const sel = selected(st);
    const maxAcs = Math.max(1, ...sel.flatMap(b => epicsOf(b).map(e => num(e.acs))));
    const cols = indent => html`<div class="ep-cols${indent ? ' indent' : ''}" aria-hidden="true"><span>Epic</span><span>Size</span><span>State</span><span>Tasks</span><span class="num">Agent time</span><span class="num">Cost</span></div>`;
    const sprintGroup = (b, s) => {
      const key = sprintKey(b, s), open = groupOpen(key, !s.done);
      const status = s.status === 'done' ? html`<span class="pill p-done">Done</span>` : s.status === 'current' ? html`<span class="pill p-current">Current</span>` : '';
      const fin = s.done ? (s.last ? `done ${fdate(s.last)}` : 'done') : s.est && arr(s.est.finish).length ? `finish ${range(arr(s.est.finish).map(ts), fdate)}` : '';
      return html`<details class="sg s-${s.status}" data-group="${key}"${open ? OPEN : ''}><summary class="flat" id="${domId('sg', key)}"><span class="chev" aria-hidden="true"></span><span class="sp-chip">${sprintId(s)}</span><span class="sg-title">${s.milestone || sprintName(s)}</span>${status}<span class="sg-meter" role="img" aria-label="${s.acsDone} of ${s.acs} ACs done"><i style="width:${pct(s.acsDone, s.acs)}%"></i></span><span class="sg-m">${s.acsDone} / ${s.acs} ACs · ${s.nDone} of ${plural(s.n, 'epic')} done${fin ? ` · ${fin}` : ''}</span></summary>
        <div class="sg-body">${s.epics.map(e => epicRow(b, e, maxAcs))}</div></details>`;
    };
    const body = b => {
      const list = epicsOf(b);
      if (b.state === 'no-blueprint') return html`<p class="empty">No blueprint yet — run discovery: <code>/speckit-blueprint-discover</code>${b.blueprint ? html` (it writes <code>${b.blueprint}</code>)` : ''}.</p>`;
      if (!list.length) return html`<p class="empty">The blueprint has no epics yet.</p>`;
      const sps = sprintsOf(b);
      const head = html`<div class="bphead">${wrapped() ? '' : html`<span class="muted">${list.filter(e => e.state === 'done').length} of ${plural(list.length, 'epic')} done</span>`}${nextStep(b, b.next)}${sps.length ? html`<span class="tools"><button type="button" class="tool" data-fold="open" data-of="${b.id}">Open all sprints</button><button type="button" class="tool" data-fold="close" data-of="${b.id}">Close all</button></span>` : ''}</div>`;
      if (!sps.length) return html`${head}${cols(false)}${ordered(b).map(e => epicRow(b, e, maxAcs))}`;
      return html`${head}${cols(true)}${sps.map(s => sprintGroup(b, s))}`;
    };
    const group = b => {
      if (!wrapped()) return html`<div class="ep-group">${body(b)}</div>`;
      const key = `epb:${b.id}`, list = epicsOf(b);
      const working = list.filter(e => isWorking(e)).length;
      return html`<details class="bpg" data-group="${key}"${groupOpen(key, false) ? OPEN : ''}><summary class="flat" id="${domId('epb', key)}">${bpSummary(b, working ? `${working} epic${working === 1 ? '' : 's'} in progress` : '')}</summary><div class="bpg-body">${body(b)}</div></details>`;
    };
    const bySprint = sel.some(b => sprintsOf(b).length);
    return html`<div class="card-h"><h2>Epics</h2><span class="lede">${wrapped() ? 'One row per blueprint; open one to see its sprints and epics' : `${bySprint ? 'By sprint, in' : 'In'} the plan’s order; size bars share one scale of acceptance criteria`}</span></div>${sel.length ? sel.map(group) : html`<p class="empty">No blueprints are configured.</p>`}`;
  }

  function epicRow(b, e, maxAcs) {
    const key = keyOf(b, e), a = obj(e.actual), est = obj(e.estimate);
    const [cls, label, note] = stateOf(e);
    const unlocks = arr(ctx.unlocks.get(key));
    const tags = [];
    if (e.critical) tags.push(html`<span class="tag-cp" title="On the critical path of the delivery plan">critical path</span>`);
    if (unlocks.length && e.state !== 'done') tags.push(html`<span title="${unlocks.map(x => `${x.id} ${x.title || ''}`).join('\n')}">unlocks ${unlocks.length}</span>`);
    if (arr(e.blocked_by).length && e.state !== 'done') tags.push(html`<span class="warnline">Waits for ${e.blocked_by.join(', ')}</span>`);
    const total = num(e.tasks_total), done = num(e.tasks_done);
    const tasks = total
      ? html`<span class="bar" role="img" aria-label="${done} of ${total} tasks done"><i style="width:${pct(done, total)}%"></i></span><span class="frac">${done}/${total}</span>`
      : html`<span class="muted">${e.state === 'done' ? '—' : e.state === 'not-compiled' ? 'not compiled' : 'no tasks yet'}</span>`;
    const stories = arr(e.stories).length;
    const size = html`<span class="sz" title="${e.size ? `Size ${e.size} in the delivery plan` : 'No size in the delivery plan'}">${e.size || '–'}</span><span class="sbar" role="img" aria-label="${num(e.acs)} acceptance criteria"><i style="width:${Math.max(3, pct(num(e.acs), maxAcs))}%"></i></span><span class="frac" title="${plural(num(e.acs), 'acceptance criterion', 'acceptance criteria')} in ${plural(stories, 'story', 'stories')}">${num(e.acs)}</span>`;
    const open = e.state !== 'done';
    const estA = open && isNum(arr(est.agent_s)[0]) ? html`<span class="meta" title="${range(est.agent_s, dur)}">est. ${rough(est.agent_s, roughDur)}</span>` : '';
    const estC = open && isNum(arr(est.cost_usd)[0]) ? html`<span class="meta" title="${range(est.cost_usd, money)}">est. ${rough(est.cost_usd, roughMoney)}</span>` : '';
    return html`<details class="epic" data-key="${key}"${ui.open.has(key) ? OPEN : ''}><summary id="${domId('ep', key)}">
      <span class="c-title"><span class="eid">${e.id || '?'}</span>${e.title || ''}${tags.length ? html`<span class="tags">${tags}</span>` : ''}</span>
      <span class="c-size" data-label="Size">${size}</span>
      <span class="c-state" data-label="State"><span class="badge st-${cls}" title="${label} (state: ${e.state || 'unknown'})"><i></i>${label}</span>${note ? html`<span class="meta">${note}</span>` : ''}</span>
      <span class="c-tasks" data-label="Tasks">${tasks}</span>
      <span class="c-num" data-label="Agent time">${num(a.agent_s) > 0 ? dur(a.agent_s) : '—'}${estA}</span>
      <span class="c-num" data-label="Cost">${costOf(a.cost_usd, a.cost_estimated, a.sessions)}${estC}</span>
    </summary><div class="epic-body">${epicBody(b, e)}</div></details>`;
  }

  function epicBody(b, e) {
    const out = [], w = obj(e.elsewhere), updated = ts(w.updated);
    const plan = [];
    if (e.goal) plan.push(['Goal', e.goal]);
    if (e.why) plan.push(['Why now', e.why]);
    if (arr(e.depends).length) {
      plan.push(['Depends on', html`${arr(e.depends).map(d => {
        const k = String(d).includes(':') ? String(d) : `${b.id}:${d}`, hit = ctx.index.get(k), ok = hit && hit.e.state === 'done';
        return html`<span class="chip ${ok ? 'c-done' : 'c-open'}" title="${hit ? `${hit.e.title || ''}: ${stateOf(hit.e)[1]}` : 'unknown'}"><i></i>${d}</span>`;
      })}`]);
    }
    const unlocks = arr(ctx.unlocks.get(keyOf(b, e)));
    if (unlocks.length && e.state !== 'done') plan.push(['Unlocks', unlocks.map(x => `${x.id} ${x.title || ''}`).join(' · ')]);
    if (e.branch) plan.push(['Branch', html`<code>${e.branch}</code>`]);
    if (e.feature) plan.push(['Feature', html`<code>${e.feature}</code>`]);
    if (plan.length) out.push(html`<dl class="plan-dl">${plan.map(([k, v]) => html`<dt>${k}</dt><dd>${v}</dd>`)}</dl>`);
    if (e.elsewhere && typeof e.elsewhere === 'object') {
      out.push(html`<p class="note">Claimed on the board by another worktree: <code>${w.worktree || '?'}</code>${w.branch ? html` on <code>${w.branch}</code>` : ''}${w.state ? ` · ${w.state}` : ''}${num(w.tasks_total) ? ` · tasks ${num(w.tasks_done)}/${w.tasks_total}` : ''}${updated ? ` · updated ${fstamp(updated)}` : ''}</p>`);
    } else if (e.started && typeof e.started === 'object') {
      const s = e.started, ref = ctx.multi ? e.key : e.id;
      out.push(s.merged_into
        ? html`<p class="note">Merged into <code>${s.merged_into}</code> but not in this checkout yet: bring it in (pull or merge).</p>`
        : s.local
          ? html`<p class="note">In progress on branch <code>${s.branch || '?'}</code>, not merged here. Continue it on that branch, or in its own worktree: <code>blueprint.py workspace ${ref} --create</code>.</p>`
          : html`<p class="note">Started on another machine or by someone else: <code>${s.remote || '?'}</code>. Continue it here with <code>blueprint.py workspace ${ref} --create</code>.</p>`);
    }
    const repos = arr(e.repositories).filter(r => r && typeof r === 'object');
    if (repos.length) out.push(html`<h4>Repositories</h4><div class="scroll"><table class="mini"><thead><tr><th>Repository</th><th>Order</th><th>Branch ← base</th><th>Tasks</th><th>Last gate</th><th>Git</th></tr></thead><tbody>${repos.map(repoRow)}</tbody></table></div>`);
    out.push(storiesBlock(e));
    const missing = arr(e.review_missing);
    if (missing.length) out.push(html`<p class="warnline">Review has no evidence for ${missing.join(', ')}</p>`);
    out.push(detailsLine(e));
    return out;
  }

  function repoRow(r) {
    const g = r.gate && typeof r.gate === 'object' ? r.gate : null, at = g && ts(g.at);
    const gate = g
      ? html`<span class="${g.ok ? 'ok' : 'bad'}" title="${g.command || ''}">${g.ok ? '✓ passed' : `✗ failed${isNum(g.exit) ? ` (exit ${g.exit})` : ''}`}</span>${at ? ` · ${fstamp(at)}` : ''}${isNum(g.duration_s) ? ` · ${dur(g.duration_s)}` : ''}`
      : html`<span class="muted">not run</span>`;
    const git = [];
    if (r.exists === false) git.push('checkout missing');
    if (r.merged === true) git.push(num(r.ahead) === 0 && !num(r.tasks_done) ? 'no commits yet' : 'merged');
    if (num(r.ahead) > 0) git.push(`${r.ahead} ahead`);
    if (num(r.behind) > 0) git.push(`${r.behind} behind`);
    if (num(r.dirty) > 0) git.push(`${r.dirty} uncommitted`);
    else if (r.dirty === 0) git.push('clean');
    if (r.current_branch && r.branch && r.current_branch !== r.branch) git.push(`checked out: ${r.current_branch}`);
    return html`<tr><td><strong>${r.name || '?'}</strong>${r.role ? html`<span class="meta">${r.role}</span>` : ''}</td><td>${isNum(r.order) ? r.order : '—'}</td>
      <td>${r.branch ? html`<code>${r.branch}</code>` : '—'}${r.base ? html` ← <code>${r.base}</code>` : ''}</td><td>${num(r.tasks_total) ? `${num(r.tasks_done)}/${r.tasks_total}` : '—'}</td>
      <td>${gate}</td><td>${git.length ? git.join(' · ') : '—'}</td></tr>`;
  }

  function firstOpen(tasks) { // the open task with the lowest number is the next one
    const n = t => { const m = /\d+/.exec(String(t.id || '')); return m ? +m[0] : Infinity; };
    return tasks.reduce((best, t) => (t && typeof t === 'object' && !t.done && (!best || n(t) < n(best)) ? t : best), null);
  }

  function taskList(tasks, next) {
    tasks = tasks.filter(t => t && typeof t === 'object');
    if (!tasks.length) return '';
    return html`<ul class="tasks">${tasks.map(t => {
      const at = ts(t.ticked_at), isNext = t === next;
      const when = t.done ? (at ? `ticked ${fstamp(at)}` : 'done') : isNext ? 'next' : 'open';
      return html`<li class="${t.done ? 'done' : isNext ? 'next' : ''}"><span class="cb${t.done ? ' on' : ''}" aria-hidden="true"></span><code class="tid">${t.id || '?'}</code>${t.repository ? html`<span class="chip">${t.repository}</span>` : ''}${t.seed ? html`<span class="seed">${t.seed}</span>` : ''}<span class="ttl">${t.title || ''}</span><span class="when">${when}</span></li>`;
    })}</ul>`;
  }

  function storiesBlock(e) {
    const stories = arr(e.stories).filter(s => s && typeof s === 'object'), other = arr(e.other_tasks);
    if (!stories.length && !other.length) return '';
    const next = e.state === 'done' ? null : firstOpen(stories.flatMap(s => arr(s.tasks)).concat(other));
    const story = s => {
      const st = String(s.state || 'open');
      const meta = join([isNum(s.acs) ? plural(s.acs, 'AC') : '', num(s.total) ? `${num(s.done)}/${s.total} tasks` : 'no tasks yet', num(s.active_s) > 0 ? `${dur(s.active_s)} active` : ''], ' · ');
      return html`<div class="story"><div class="story-h"><span class="sid">${s.id || ''}</span><span>${s.title || ''}</span><span class="sst s-${st}">${st.replace('-', ' ')}</span><span class="meta">${meta}</span></div>${taskList(arr(s.tasks), next)}</div>`;
    };
    return html`<h4>Stories</h4>${stories.map(story)}${other.length ? html`<div class="story"><div class="story-h"><span>Tasks outside stories</span></div>${taskList(other, next)}</div>` : ''}`;
  }

  function shares(o) { // "opus 80%, sonnet 20%", or the one name
    const list = Object.entries(obj(o)).filter(([, v]) => num(v) > 0).sort((x, y) => y[1] - x[1]);
    const total = sum(list, x => x[1]);
    return list.length === 1 ? list[0][0] : list.map(([k, v]) => `${k} ${Math.round((100 * v) / total)}%`).join(', ');
  }

  function detailsLine(e) {
    const a = obj(e.actual);
    if (!num(a.sessions) && !num(a.agent_s)) return html`<p class="meta">No recorded sessions for this epic yet.</p>`;
    const byDesc = (x, y) => num(y[1]) - num(x[1]);
    const subs = Object.entries(obj(a.subagents)).map(([k, v]) => `${k} ×${num(obj(v).runs)}${Object.keys(obj(obj(v).efforts)).length ? ` (effort ${shares(obj(v).efforts)})` : ''}`);
    const repoTime = Object.entries(obj(a.repos)).map(([k, v]) => [k, num(obj(v).tool_s), num(obj(v).calls)]).sort(byDesc).map(([k, s, n]) => `${k} ${dur(s)} (${plural(n, 'call')})`);
    const items = [['Model time', dur(a.model_s)], ['Tool time', dur(a.tool_s)], ['Waited for you', dur(a.wait_s)],
      ['Human gates', isNum(a.gates) ? a.gates : ''], ['Sessions', isNum(a.sessions) ? a.sessions : ''], ['Calendar', isNum(a.calendar_s) ? cal(a.calendar_s) : ''],
      ['Tokens', isNum(a.tokens) ? tok(a.tokens) : ''], ['Per AC', num(e.acs) && isNum(a.cost_usd) ? `${money(a.cost_usd / e.acs)} · ${dur(num(a.agent_s) / e.acs)}` : ''],
      ['Phases', Object.entries(obj(a.phases)).sort(byDesc).map(([k, v]) => `${k} ${dur(num(v))}`).join(', ')],
      ['Models', shares(a.models)], ['Effort', shares(a.efforts)], ['Subagents', subs.join(', ')], ['Tool time by repository', repoTime.join(', ')]];
    return html`<dl class="details">${items.filter(([, v]) => v !== '').map(([k, v]) => html`<div><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>`;
  }

  // ---------- charts (inline SVG) ----------
  function chartWidth() { // the inner width of a card, measured from the KPI row (always rendered first)
    const k = document.getElementById('kpis');
    const w = k && k.clientWidth ? k.clientWidth - 34 : 0;
    return Math.max(320, Math.round(w || 900));
  }
  const tableView = (key, head, rows) => html`<details class="tv" data-key="${key}"${ui.open.has(key) ? OPEN : ''}><summary id="${domId('tv', key)}">Show as a table</summary><div class="scroll"><table><thead><tr>${head.map(h => html`<th>${h}</th>`)}</tr></thead><tbody>${rows.map(r => html`<tr>${r.map(c => html`<td>${c}</td>`)}</tr>`)}</tbody></table></div></details>`;

  function mergeSpans(sp) {
    const out = [];
    for (const [s, x] of sp.slice().sort((p, q) => p[0] - q[0])) {
      const last = out[out.length - 1];
      if (last && s <= last[1]) last[1] = Math.max(last[1], x); else out.push([s, Math.max(s, x)]);
    }
    return out;
  }

  function spansOf(e) { // worked stretches as [start, end] in ms, merged
    const a = obj(e.actual);
    let sp = arr(a.spans).map(p => [ts(arr(p)[0]), ts(arr(p)[1])]).filter(p => isNum(p[0]) && isNum(p[1]));
    if (!sp.length && isNum(ts(a.first)) && isNum(ts(a.last))) sp = [[ts(a.first), ts(a.last)]];
    return mergeSpans(sp);
  }

  // Remaining epics on `parallelism` slots in delivery order, after their dependencies (as estimate.py schedules
  // them); P50 and P90 are scheduled separately. Length = estimated calendar time minus the time spent.
  function forecast(b, now) {
    const k = Math.max(1, Math.round(num(obj(b.remaining).parallelism)) || 1), out = {};
    [0, 1].forEach(q => {
      const slots = new Array(k).fill(now), fin = {};
      for (const e of ordered(b)) {
        const est = obj(e.estimate), c = arr(est.calendar_s)[q];
        if (e.state === 'done' || !isNum(c)) continue;
        const len = Math.max(0, c - num(obj(est.spent).calendar_s)) * 1000;
        const ready = Math.max(now, ...arr(e.depends).map(d => fin[d] || now));
        const i = slots.indexOf(Math.min(...slots)), start = Math.max(ready, slots[i]);
        fin[e.id] = slots[i] = start + len;
        out[e.id] = Object.assign(out[e.id] || {}, q ? { s90: start, e90: start + len } : { s50: start, e50: start + len });
      }
    });
    for (const id of Object.keys(out)) if (!isNum(out[id].e50) || !isNum(out[id].e90)) delete out[id];
    return out;
  }

  function ticks(lo, hi, max) {
    const M = 60e3, H = 60 * M, D = 24 * H;
    const step = [5 * M, 10 * M, 15 * M, 30 * M, H, 2 * H, 3 * H, 6 * H, 12 * H, D, 2 * D, 7 * D, 14 * D].find(s => (hi - lo) / s <= max) || 30 * D;
    const out = [], d0 = new Date(lo);
    if (step < D) {
      let t = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()).getTime();
      while (t < lo) t += step;
      for (; t <= hi; t += step) out.push(t);
    } else {
      const c = step < 30 * D ? new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()) : new Date(d0.getFullYear(), d0.getMonth(), 1);
      const advance = () => (step < 30 * D ? c.setDate(c.getDate() + step / D) : c.setMonth(c.getMonth() + 1));
      if (c.getTime() < lo) advance();
      for (; c.getTime() <= hi && out.length < 400; advance()) out.push(c.getTime());
    }
    const every = Math.max(1, Math.ceil(out.length / max));
    return { step, list: out.filter((_, i) => i % every === 0) };
  }

  // One row per sprint (its epics' worked time merged, its open epics' forecast joined) and, for one blueprint,
  // one row per epic of the sprints not done yet. Several blueprints: sprints only.
  function timelineRows(sel, now) {
    const rows = [];
    for (const b of sel) {
      const plan = forecast(b, now), sps = sprintsOf(b);
      if (sel.length > 1) rows.push({ group: bpName(b) });
      if (!sps.length) { for (const e of ordered(b)) rows.push({ b, e, spans: spansOf(e), f: plan[e.id] || null }); continue; }
      for (const s of sps) {
        const fs = s.epics.map(e => plan[e.id]).filter(Boolean);
        const f = fs.length ? { s50: Math.min(...fs.map(x => x.s50)), e50: Math.max(...fs.map(x => x.e50)), e90: Math.max(...fs.map(x => x.e90)) } : null;
        rows.push({ b, s, spans: mergeSpans(s.epics.flatMap(spansOf)), f });
        if (sel.length === 1 && !s.done) for (const e of s.epics) rows.push({ b, e, spans: spansOf(e), f: plan[e.id] || null, inner: true });
      }
    }
    return rows;
  }

  function timeline(st) {
    const sel = selected(st).filter(b => epicsOf(b).length), now = Math.floor(ctx.now / 60000) * 60000;
    const rows = timelineRows(sel, now);
    let lo = Infinity, hi = -Infinity;
    for (const r of rows) {
      for (const [s, x] of r.spans || []) { lo = Math.min(lo, s); hi = Math.max(hi, x); }
      if (r.f) { lo = Math.min(lo, r.f.s50); hi = Math.max(hi, r.f.e90, r.f.e50); }
    }
    if (!isFinite(lo)) return html`<div class="card-h"><h2>Timeline</h2></div><p class="empty">No recorded activity or forecast yet.</p>`;
    lo = Math.min(lo, now); hi = Math.max(hi, now);
    const padT = Math.max((hi - lo) * 0.02, 5 * 60e3); lo -= padT; hi += padT;
    const W = chartWidth(), L = Math.min(230, Math.round(W * 0.32)), R = 14, top = 22;
    const rowH = r => (r.group ? 30 : r.s ? 28 : 24);
    const H = top + rows.reduce((t, r) => t + rowH(r), 0) + 24;
    const x = t => L + ((t - lo) / (hi - lo)) * (W - L - R), f1 = n => n.toFixed(1);
    const tk = ticks(lo, hi, Math.max(2, Math.floor((W - L - R) / 96)));
